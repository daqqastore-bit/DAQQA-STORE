<style>
.so-page{min-height:70vh;display:grid;place-items:start center;padding:56px 0 20px;background:radial-gradient(ellipse at 50% 0%,rgb(var(--accent-rgb)/.14),transparent 60%)}
.so-card{width:min(520px,100%);text-align:center}
.so-logo{width:84px;height:88px;margin:0 auto 18px;display:block;color:var(--accent)}
.so-card h1{font:500 30px var(--f-display);letter-spacing:.22em;color:var(--ink);direction:ltr}
.so-card .so-sub{color:var(--muted);margin:10px auto 30px;max-width:380px;line-height:1.8}
.so-list{display:grid;gap:12px;text-align:right}
.so-it{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s;opacity:0;animation:soIn .5s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i) * 60ms)}
.so-it:hover{transform:translateY(-2px);border-color:var(--sc);box-shadow:0 14px 30px -18px var(--sc)}
.so-it .so-ic{width:46px;height:46px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff;background:var(--sc)}
.so-it .so-ic svg{width:23px;height:23px}
.so-it[data-t="tiktok"] .so-ic,.so-it[data-t="x"] .so-ic,.so-it[data-t="threads"] .so-ic{background:#111;box-shadow:inset 0 0 0 1px rgb(255 255 255/.12)}
.so-it[data-t="snapchat"] .so-ic{color:#111}
.so-it[data-t="phone"] .so-ic,.so-it[data-t="email"] .so-ic,.so-it[data-t="website"] .so-ic{color:var(--bg)}
.so-txt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.so-txt b{font-size:15.5px;font-weight:600}
.so-txt small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.so-go{width:20px;height:20px;color:var(--muted);flex:none;transition:transform .25s,color .25s}
.so-it:hover .so-go{transform:translateX(-4px);color:var(--sc)}
.so-empty{color:var(--muted);padding:30px 0}
@keyframes soIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.so-it{animation:none;opacity:1}}

<style id="dqLoadCss">
/* first paint: our own loading screen while fonts, styles and products arrive (slow connections never see a broken page) */
#dqLoad{position:fixed;inset:0;z-index:2000;display:none;place-items:center;background:#18110A;color:#D0B48C;font-family:Georgia,'Times New Roman',serif}
:root[data-theme="light"] #dqLoad{background:#F6F1E9;color:#8A6438}
html.dq-loading #dqLoad{display:grid}
html.dq-loading body{overflow:hidden}
html.dq-loading body>*:not(#dqLoad){visibility:hidden}
html.dq-loading body>*:not(#dqLoad) *{animation-play-state:paused!important}
#dqLoad .c{display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0;animation:dqlIn .6s ease .25s forwards}
#dqLoad svg{width:92px;height:95px;overflow:visible}
#dqLoad .ring{fill:none;stroke:currentColor;stroke-width:9;stroke-dasharray:500;stroke-dashoffset:500;animation:dqlDraw 1.6s cubic-bezier(.6,0,.2,1) .25s forwards}
#dqLoad .hand{stroke:currentColor;stroke-width:3;stroke-linecap:round;transform-origin:92px 92px;animation:dqlSpin 1.4s linear infinite}
#dqLoad .tail{stroke:currentColor;stroke-width:9;stroke-linecap:round}
#dqLoad b{font-weight:400;font-size:20px;letter-spacing:.5em;padding-left:.5em;color:#F5F0E8}
:root[data-theme="light"] #dqLoad b{color:#18110A}
#dqLoad .bar{width:140px;height:1px;background:rgba(208,180,140,.2);overflow:hidden;position:relative}
#dqLoad .bar i{position:absolute;inset:0;width:40%;background:currentColor;animation:dqlBar 1.2s ease-in-out infinite}
#dqLoad.out{animation:dqlOut .9s cubic-bezier(.7,0,.2,1) forwards;pointer-events:none}
#dqLoad.out .c{animation:dqlZoom .7s cubic-bezier(.7,0,.2,1) forwards}
@keyframes dqlIn{to{opacity:1}}
@keyframes dqlDraw{to{stroke-dashoffset:0}}
@keyframes dqlSpin{to{transform:rotate(360deg)}}
@keyframes dqlBar{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
@keyframes dqlOut{0%{clip-path:circle(150% at 50% 50%)}100%{clip-path:circle(0% at 50% 50%)}}
@keyframes dqlZoom{to{opacity:0;transform:scale(1.25)}}
#dqBar{position:fixed;top:0;left:0;right:0;height:2px;z-index:2001;pointer-events:none;background:linear-gradient(90deg,transparent,#D0B48C,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:dqlBar2 1.1s ease-in-out infinite;transition:opacity .4s}
#dqBar.done{opacity:0}
@keyframes dqlBar2{from{background-position:-40% 0}to{background-position:140% 0}}
@media (prefers-reduced-motion:reduce){#dqLoad *{animation-duration:0s!important}}
</style>
<script>
/* full loader on the first page of a visit; afterwards only a thin top bar */
(function(){var d=document.documentElement,first=true;try{first=sessionStorage.getItem('dq-seen')!=='1';sessionStorage.setItem('dq-seen','1')}catch(e){}
window.DQ_LOADER=first;if(first)d.classList.add('dq-loading');
setTimeout(function(){if(d.classList.contains('dq-loading')&&window.DQ_reveal)window.DQ_reveal();else d.classList.remove('dq-loading')},12000);})();
</script>

<script>
// every social account + contact number the admin added, as one tidy page
DQ.start(null, () => {
  const list = RC.socials(DQ.settings), esc = RC.esc;
  document.querySelector('#page').innerHTML = `<section class="so-page"><div class="wrap so-card op">
    <span class="so-logo">${RC.logo()}</span><h1>DAQQA</h1>
    <p class="so-sub">تابعنا واعرف الجديد أول بأول، وكلّمنا من أي مكان يريحك.</p>
    <div class="so-list">${list.length ? list.map((x, i) => { const t = RC.SOCIAL[x.type], href = RC.socialHref(x), ext = /^https?:/.test(href);
      return `<a class="so-it" data-t="${esc(x.type)}" href="${esc(href)}" ${ext ? 'target="_blank" rel="noopener"' : ''} style="--sc:${t.color};--i:${i}"><span class="so-ic">${t.icon}</span><span class="so-txt"><b>${esc(RC.socialName(x))}</b><small class="en" dir="ltr">${esc(RC.socialLabel(x))}</small></span>${DQ.ICON.arrow.replace('<svg', '<svg class="so-go"')}</a>`; }).join('')
      : '<div class="so-empty">مفيش حسابات متضافة لسه.</div>'}</div></div></section>`;
  DQ.reveal && DQ.reveal();
});
</script>
