<style>
.po-page{padding:48px 0 30px;background:radial-gradient(ellipse at 50% 0%,rgb(var(--accent-rgb)/.12),transparent 60%)}
.po-in{width:min(820px,100%);margin:0 auto}
.po-hero{text-align:center;margin-bottom:26px}
.po-hero .lbl{font:500 13px var(--f-display);letter-spacing:.32em;color:var(--accent)}
.po-hero h1{font:700 clamp(26px,4vw,36px)/1.4 var(--f-ar);color:var(--ink);margin-top:8px}
.po-hero p{color:var(--muted);margin-top:8px;line-height:1.8}
.po-nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 26px}
.po-nav a{padding:9px 16px;border:1px solid var(--line);border-radius:999px;font-size:13.5px;color:var(--ink);background:var(--surface);transition:border-color .2s,color .2s}
.po-nav a:hover{border-color:var(--accent);color:var(--accent)}
.po-sec{display:grid;grid-template-columns:52px 1fr;gap:16px;padding:22px 22px;border:1px solid var(--line);border-radius:20px;background:var(--surface);margin-bottom:14px;scroll-margin-top:96px}
.po-ic{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;background:rgb(var(--accent-rgb)/.12);color:var(--accent)}
.po-ic svg{width:25px;height:25px}
.po-sec h2{font:700 19px/1.5 var(--f-ar);color:var(--ink)}
.po-sec ul{margin-top:10px;display:grid;gap:9px;padding:0;list-style:none}
.po-sec li{position:relative;padding-inline-start:16px;line-height:1.85;color:var(--muted);font-size:14.5px}
.po-sec li::before{content:"";position:absolute;inset-inline-start:0;top:.8em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.po-sec li b{color:var(--ink);font-weight:600}
.po-help{scroll-margin-top:96px;text-align:center;padding:24px 18px;border:1px dashed rgb(var(--accent-rgb)/.4);border-radius:20px;margin-top:6px}
.po-help p{color:var(--muted);margin-bottom:14px}
.po-help .btn{display:inline-flex;gap:8px;align-items:center}
.po-upd{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}
@media (max-width:600px){.po-page{padding:32px 0 20px}.po-sec{grid-template-columns:1fr;gap:10px;padding:18px 16px}.po-ic{width:44px;height:44px;border-radius:13px}.po-ic svg{width:22px;height:22px}}

<style id="dqLoadCss">
/* first paint: our own loading screen while fonts, styles and products arrive (slow connections never see a broken page) */
#dqLoad{position:fixed;inset:0;z-index:2000;display:none;place-items:center;background:#18110A;color:#D0B48C;font-family:Georgia,'Times New Roman',serif}
:root[data-theme="light"] #dqLoad{background:#F6F1E9;color:#8A6438}
html.dq-loading #dqLoad{display:grid}
html.dq-loading body{overflow:hidden}
html.dq-loading body>*:not(#dqLoad){visibility:hidden}
html.dq-loading body>*:not(#dqLoad) *{animation-play-state:paused!important}
#dqLoad .c{display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0;animation:dqlIn .6s ease .25s forwards}
#dqLoad svg{width:92px;height:95px;overflow:visible}
#dqLoad .ring{fill:none;stroke:currentColor;stroke-width:9;stroke-dasharray:500;stroke-dashoffset:500;animation:dqlDraw 1.6s cubic-bezier(.6,0,.2,1) .25s forwards}
#dqLoad .hand{stroke:currentColor;stroke-width:3;stroke-linecap:round;transform-origin:92px 92px;animation:dqlSpin 1.4s linear infinite}
#dqLoad .tail{stroke:currentColor;stroke-width:9;stroke-linecap:round}
#dqLoad b{font-weight:400;font-size:20px;letter-spacing:.5em;padding-left:.5em;color:#F5F0E8}
:root[data-theme="light"] #dqLoad b{color:#18110A}
#dqLoad .bar{width:140px;height:1px;background:rgba(208,180,140,.2);overflow:hidden;position:relative}
#dqLoad .bar i{position:absolute;inset:0;width:40%;background:currentColor;animation:dqlBar 1.2s ease-in-out infinite}
#dqLoad.out{animation:dqlOut .9s cubic-bezier(.7,0,.2,1) forwards;pointer-events:none}
#dqLoad.out .c{animation:dqlZoom .7s cubic-bezier(.7,0,.2,1) forwards}
@keyframes dqlIn{to{opacity:1}}
@keyframes dqlDraw{to{stroke-dashoffset:0}}
@keyframes dqlSpin{to{transform:rotate(360deg)}}
@keyframes dqlBar{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
@keyframes dqlOut{0%{clip-path:circle(150% at 50% 50%)}100%{clip-path:circle(0% at 50% 50%)}}
@keyframes dqlZoom{to{opacity:0;transform:scale(1.25)}}
#dqBar{position:fixed;top:0;left:0;right:0;height:2px;z-index:2001;pointer-events:none;background:linear-gradient(90deg,transparent,#D0B48C,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:dqlBar2 1.1s ease-in-out infinite;transition:opacity .4s}
#dqBar.done{opacity:0}
@keyframes dqlBar2{from{background-position:-40% 0}to{background-position:140% 0}}
@media (prefers-reduced-motion:reduce){#dqLoad *{animation-duration:0s!important}}
</style>
<script>
/* full loader on the first page of a visit; afterwards only a thin top bar */
(function(){var d=document.documentElement,first=true;try{first=sessionStorage.getItem('dq-seen')!=='1';sessionStorage.setItem('dq-seen','1')}catch(e){}
window.DQ_LOADER=first;if(first)d.classList.add('dq-loading');
setTimeout(function(){if(d.classList.contains('dq-loading')&&window.DQ_reveal)window.DQ_reveal();else d.classList.remove('dq-loading')},12000);})();
</script>

<script>
// shipping, payment, exchange, cancellation, privacy… — the words and sections come from Admin → Settings → السياسة; the shipping areas follow the admin's own areas and prices
DQ.start(null, () => {
  const S = DQ.settings || {}, esc = RC.esc, P = RC.policy(S);
  const govs = Array.isArray(S.ship_govs) && S.ship_govs.length ? S.ship_govs : null;
  const zones = (Array.isArray(S.shipping_zones) ? S.shipping_zones : []).filter(z => z && Array.isArray(z.cities) && z.cities.length);
  const fee = c => { const z = zones.find(z => z.cities.includes(c)); return z ? +z.price : +(S.shipping_fee || 0); };
  const vals = { 'المحافظات': govs ? govs.map(c => `<b>${esc(c)}</b>${fee(c) ? ` (${RC.money(fee(c))})` : ' (مجاني)'}`).join('، ') : 'كل محافظات مصر',
    'حد الشحن المجاني': S.free_shipping_over ? RC.money(S.free_shipping_over) : '' };
  const wa = DQ.wa ? DQ.wa() : '';
  const secs = P.sections.map(x => ({ ...x, lines: x.items.map(i => RC.policyLine(i, vals)).filter(Boolean) })).filter(x => x.t.trim() || x.lines.length);
  const sec = x => `<section class="po-sec op" id="${esc(x.id)}"><span class="po-ic">${RC.POLICY_IC[x.icon] || RC.POLICY_IC.doc}</span><div><h2>${esc(x.t)}</h2>${x.lines.length ? `<ul>${x.lines.map(l => `<li>${l}</li>`).join('')}</ul>` : ''}</div></section>`;
  document.querySelector('#page').innerHTML = `<section class="po-page"><div class="wrap po-in">
    <div class="po-hero op">${P.lbl.trim() ? `<div class="lbl en">${esc(P.lbl)}</div>` : ''}<h1>${esc(P.title)}</h1>${P.intro.trim() ? `<p>${esc(P.intro)}</p>` : ''}</div>
    ${secs.length > 1 ? `<nav class="po-nav op" aria-label="أقسام الصفحة">${secs.map(x => `<a href="#${esc(x.id)}">${esc(x.t)}</a>`).join('')}</nav>` : ''}
    ${secs.map(sec).join('')}
    ${P.help.trim() || P.btn.trim() ? `<div class="po-help op" id="help">${P.help.trim() ? `<p>${esc(P.help)}</p>` : ''}${P.btn.trim() ? (wa ? `<a class="btn btn-primary" href="https://wa.me/${esc(wa)}" target="_blank" rel="noopener">${esc(P.btn)}</a>` : `<a class="btn btn-primary" href="social.html">${esc(P.btn)}</a>`) : ''}</div>` : ''}
    ${P.upd.trim() ? `<p class="po-upd">${esc(P.upd)}</p>` : ''}
  </div></section>`;
  DQ.reveal && DQ.reveal();
  // first paint only: live refreshes re-render the page and must not yank the reader back to the #section
  if (location.hash && !DQ._hashDone && !DQ.restoreY) { const el = document.querySelector(location.hash); if (el) setTimeout(() => el.scrollIntoView(), 60); } DQ._hashDone = true;
});
</script>
