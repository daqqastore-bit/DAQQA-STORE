  if ($('#thumbs')) $('#thumbs').onclick = e => { const b = e.target.closest('[data-i]'); if (b) go(+b.dataset.i); };
  slides.addEventListener('scroll', () => {
    const i = Math.round(Math.abs(slides.scrollLeft) / slides.clientWidth);
    document.querySelectorAll('#thumbs button').forEach((b, k) => b.classList.toggle('on', k === i));
    document.querySelectorAll('#dots i').forEach((b, k) => b.classList.toggle('on', k === i));
  }, { passive: true });
  const n = slides.querySelectorAll('.slide').length;
  if (n > 1 && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    let cur = 0, hold = false, done = false;
    const auto = setInterval(() => { if (done || !document.body.contains(slides)) return clearInterval(auto); if (hold || document.hidden) return; cur = (Math.round(Math.abs(slides.scrollLeft) / slides.clientWidth) + 1) % n; go(cur); }, 3500);
    const quit = () => { done = true; };
    slides.addEventListener('pointerenter', () => hold = true); slides.addEventListener('pointerleave', () => hold = false);
    slides.addEventListener('click', quit); slides.addEventListener('touchstart', quit, { passive: true }); slides.addEventListener('wheel', quit, { passive: true });
    if ($('#thumbs')) $('#thumbs').addEventListener('click', quit);
  }
  slides.querySelectorAll('.slide').forEach((sl, k) => sl.onclick = () => viewer(imgs, k, p.name));
  // a colour swatch jumps to the photo linked to it in the admin
  document.querySelectorAll('.pd-colors [data-pick]').forEach(b => b.onclick = () => { const k = imgs.indexOf(RC.colorImg(p, b.dataset.pick)); if (k < 0) return;
    slides.dispatchEvent(new Event('click')); go(k); document.querySelectorAll('.pd-colors [data-pick]').forEach(x => x.classList.toggle('on', x === b)); });
  // small arrows on the photo + keyboard ←/→ (RTL: left = next photo)
  if (n > 1) {
    const at = () => Math.round(Math.abs(slides.scrollLeft) / slides.clientWidth), step = d => go((at() + d + n) % n);
    const host = slides.parentElement; host.classList.add('has-arr');
    host.insertAdjacentHTML('beforeend', '<button type="button" class="gal-arr ga-n" aria-label="الصورة اللي بعدها"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button><button type="button" class="gal-arr ga-p" aria-label="الصورة اللي قبلها"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>');
    host.querySelector('.gal-arr.ga-n').onclick = e => { e.stopPropagation(); slides.dispatchEvent(new Event('click')); step(1); };
    host.querySelector('.gal-arr.ga-p').onclick = e => { e.stopPropagation(); slides.dispatchEvent(new Event('click')); step(-1); };
    galKey = e => { if (e.altKey || e.ctrlKey || e.metaKey || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '') || document.querySelector('body > .pv')) return;
      if (e.key === 'ArrowLeft') { e.preventDefault(); slides.dispatchEvent(new Event('click')); step(1); } else if (e.key === 'ArrowRight') { e.preventDefault(); slides.dispatchEvent(new Event('click')); step(-1); } };
  } else galKey = null;
  // the frame takes the main photo's own shape (kept between tall 3:4 and wide 16:9); other photos fit inside it uncropped
  const first = slides.querySelector('.slide img'), gal = slides.closest('.gal');
  const fit = () => { if (gal && first.naturalWidth) gal.style.setProperty('--ar', Math.min(16 / 9, Math.max(3 / 4, first.naturalWidth / first.naturalHeight)).toFixed(4)); };
  if (first) { if (first.complete) fit(); else first.addEventListener('load', fit, { once: true }); }

  // buy
  if (p.stock > 0) {
    $('#qm').onclick = () => { q = Math.max(1, q - 1); $('#qv').textContent = q; };
    $('#qp').onclick = () => { q = Math.min(p.stock, 20, q + 1); $('#qv').textContent = q; };
    // every option must be chosen first; the first missing one lights up and says what's needed
    const need = () => { const g = vs.find(g => !sel[g.k]); if (!g) return false;
      const el = document.querySelector(`.po-g[data-g="${g.k}"]`); el.classList.remove('err'); void el.offsetWidth; el.classList.add('err');
      el.scrollIntoView({ behavior: 'smooth', block: 'center' }); DQ.toast(g.o.every(RC.optOut) ? `كل اختيارات ${g.ar} مش متاحة دلوقتي` : `اختار ${g.ar} الأول`, 'err'); return true; };
    const opt = () => vs.length ? { ...sel } : undefined;
    $('#addBtn').onclick = () => { if (!need()) DQ.addToCart(p.id, q, false, opt()); };
    $('#buyBtn').onclick = () => { if (need()) return; DQ.addToCart(p.id, q, true, opt()); DQ.openCart('checkout'); };
    const sb = $('#sbar');
    sb.innerHTML = `<img ${DQ.thumb(p)} alt=""><div class="t"><b class="en">${esc(p.name)}</b>${DQ.priceHTML(p, RC.optExtra(p, sel), true)}</div><button class="btn btn-amber btn-sm" id="sbBuy">اطلب دلوقتي</button>`;
    $('#sbBuy').onclick = () => { if (need()) return; DQ.addToCart(p.id, q, true, opt()); DQ.openCart('checkout'); };
    new IntersectionObserver(([e]) => sb.classList.toggle('on', !e.isIntersecting && e.boundingClientRect.top < 0)).observe($('#buy'));
  }
  // options work on Coming Soon pieces too (try them and see the photo; no buying)
  if ($('#opts')) {
    DQ.optApply($('#opts'), p, sel, {});
    $('#opts').addEventListener('click', e => { const b = e.target.closest('.po-card'); if (!b) return; const g = b.closest('.po-g').dataset.g, t = e.target.closest('[data-ti]');
      // a small photo on the card: that photo shows (and picks the dial it belongs to); otherwise the photo that fits everything picked
      const r = t ? DQ.optThumb(p, t) : null; if (DQ.optApply($('#opts'), p, sel, r ? r.picks : { [g]: b.dataset.o }) === false) return; if (r) { b.querySelector(':scope>img').src = r.u; b.querySelectorAll('[data-ti]').forEach(x => x.classList.toggle('on', x === t)); }
      const u = r ? r.u : RC.optPhoto(p, sel, g), k = u ? imgs.indexOf(u) : -1;
      if (k >= 0) { slides.dispatchEvent(new Event('click')); go(k); } });
    if (askOpts && !window._askedOpts) { window._askedOpts = 1; setTimeout(() => { $('#opts').scrollIntoView({ behavior: 'smooth', block: 'center' }); DQ.toast('اختار المواصفات اللي تعجبك وبعدين أضفها للسلة'); }, 500); }
  }
  $('#shareBtn').onclick = async () => {
    try { if (navigator.share) { await navigator.share({ title: p.name + ' | DAQQA', url }); return; } } catch (e) { return; }
    try { await navigator.clipboard.writeText(url); DQ.toast('اتنسخ اللينك ✓', 'ok'); } catch (e) { DQ.toast('انسخ اللينك من شريط العنوان', 'err'); }
  };

  // the sticky gallery sits just under the (sticky) header, whatever its height
  { const h = document.getElementById('hdr'); if (h && window.ResizeObserver) new ResizeObserver(() => document.documentElement.style.setProperty('--hdr', h.offsetHeight + 'px')).observe(h); }
  // «رجوع»: one step back in the history when the visitor came from this site, otherwise to the product's section
  document.querySelectorAll('[data-back]').forEach(b => b.onclick = () => {
    let same = false; try { same = !!document.referrer && new URL(document.referrer).origin === location.origin; } catch (e) {}
    if (same && history.length > 1) history.back(); else location.href = LUX ? 'luxury.html' : './#' + kind;
  });
  // related
  // never another gender's piece: a men's watch suggests men's + unisex, a women's one women's + unisex (unisex suggests all)
  const genOk = x => p.category === 'unisex' || x.category === p.category || x.category === 'unisex';
  const rel = DQ.products.filter(x => x.id !== p.id && RC.isLuxury(x) === RC.isLuxury(p) && genOk(x)).sort((a, b) => ((RC.kindOf(b) === kind) - (RC.kindOf(a) === kind)) || ((b.category === p.category) - (a.category === p.category)) || (b.featured - a.featured)).slice(0, 4);
  if (rel.length && LUX) $('#related').innerHTML = `<div class="lxp-rel-h"><span class="en">FROM THE PRIVÉ COLLECTION</span><h2 class="en">More <em>Pieces</em></h2><a href="luxury.html">كل المجموعة ←</a></div><div class="grid">${rel.map(DQ.card).join('')}</div>`;
  else if (rel.length) {
    // the last tile of the grid leads to the whole section instead of a small text link in the header
    const n = DQ.products.filter(x => RC.kindOf(x) === kind && !RC.isLuxury(x)).length;
    const more = `<a class="rel-more" href="./#${kind}"><span class="rm-cap en">DAQQA · ${K.en.toUpperCase()}</span><b class="en">Explore all<br><em>${K.en}</em></b><span class="rm-ar">اكتشف كل ال${K.ar}</span><span class="rm-foot"><small><b class="en">${n}</b> ${n === 1 ? 'قطعة' : 'قطع'}</small><i>${DQ.ICON.arrow}</i></span></a>`;
    $('#related').innerHTML = `<div class="sec-head"><h2 class="en">You may <em>also like</em><span class="ar">ممكن تعجبك كمان</span></h2></div><div class="grid">${rel.slice(0, 3).map(DQ.card).join('')}${more}</div>`;
  }
  DQ.renderFavs(); DQ.reveal();
}
DQ.onRefresh = () => {};
DQ.start('product', () => { if (!pid || isNaN(pid)) return notFound(); render(); });
</script>
</body>
</html>
