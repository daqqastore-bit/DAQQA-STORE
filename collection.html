.c-hero{position:relative;overflow:hidden;background:radial-gradient(ellipse at 80% 0%,rgb(var(--accent-rgb)/.16),transparent 60%),var(--hero);border-bottom:1px solid var(--line)}
.c-hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;min-height:360px;padding-top:56px;padding-bottom:56px}
.c-hero .big{position:absolute;inset:auto auto -0.18em -0.04em;font:400 clamp(120px,22vw,320px)/1 var(--f-display);color:rgb(var(--accent-rgb)/.08);letter-spacing:.02em;pointer-events:none;direction:ltr;user-select:none}
.c-hero .mini-brand{display:inline-flex;flex-direction:column;direction:ltr;margin-bottom:22px}
.c-hero .mini-brand b{font:500 22px var(--f-display);letter-spacing:.24em;color:var(--ink)}
.c-hero .mini-brand small{font:600 9px var(--f-ui);letter-spacing:.62em;color:var(--accent);margin-top:4px}
.c-hero h1{font:400 clamp(44px,6vw,84px)/1 var(--f-display);color:var(--ink)}
.c-hero .ar{font:600 clamp(22px,2.6vw,32px)/1.6 var(--f-ar);color:var(--accent);margin-top:10px}
.c-hero p{color:var(--muted);margin-top:12px;max-width:440px}
.c-hero .count{display:inline-flex;gap:10px;margin-top:22px;font:600 12px var(--f-ui);letter-spacing:.2em;color:var(--muted)}
.c-hero .count b{color:var(--ink)}
.c-cover{position:absolute;inset:0;background-size:cover;background-position:center;animation:cZoom 14s ease-out both}
.c-hero.has-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(14,10,6,.88) 0%,rgba(14,10,6,.55) 45%,rgba(14,10,6,.1) 100%)}
.c-hero.has-cover .wrap{z-index:2;min-height:440px}.c-hero.has-cover h1,.c-hero.has-cover .mini-brand b{color:#F5F0E8}.c-hero.has-cover p,.c-hero.has-cover .count{color:#D8CBB8}.c-hero.has-cover .count b{color:#fff}
@keyframes cZoom{from{transform:scale(1.12)}}
.c-stack{position:relative;height:300px}
.c-stack img{position:absolute;width:52%;aspect-ratio:4/5;object-fit:cover;border-radius:24px;box-shadow:0 40px 70px -30px rgba(0,0,0,.6);border:1px solid rgb(var(--accent-rgb)/.25);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.c-stack img:nth-child(1){left:24%;top:-10%;z-index:3;transform:rotate(-3deg)}
.c-stack img:nth-child(2){left:2%;top:6%;z-index:2;transform:rotate(-11deg);opacity:.9}
.c-stack img:nth-child(3){left:46%;top:8%;z-index:1;transform:rotate(9deg);opacity:.9}
.c-hero:hover .c-stack img:nth-child(2){transform:rotate(-15deg) translateX(-14px)}
.c-hero:hover .c-stack img:nth-child(3){transform:rotate(13deg) translateX(14px)}
.c-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:26px 0 18px;border-bottom:1px solid var(--s-line)}
.c-bar .tabs{display:flex;gap:6px;flex-wrap:wrap}
.c-bar .tabs button{height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--s-line);color:var(--strip-ink);font-size:14px;font-weight:600;transition:background .2s,color .2s,border-color .2s}
.c-bar .tabs button:hover{border-color:var(--strip-ink)}
.c-bar .tabs button.on{background:var(--strip-ink);color:var(--strip-bg);border-color:var(--strip-ink)}
.c-bar .tabs button small{opacity:.6;margin-inline-start:6px;font-family:var(--f-ui)}
.c-bar select{height:40px;border-radius:999px;border:1px solid var(--s-line);background:#fff;color:var(--strip-ink);padding:0 16px;font-size:14px}
.c-grid{padding:30px 0 80px}
.c-grid .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.c-empty{padding:60px 0;text-align:center;color:var(--s-muted)}
@media (max-width:1000px){.c-grid .grid{grid-template-columns:repeat(3,1fr)}}
@media (max-width:900px){.c-hero .wrap{grid-template-columns:1fr;min-height:0;padding-top:40px}.c-stack{height:230px;max-width:420px;width:100%;margin:10px auto 0}}
@media (max-width:640px){.c-grid .grid{grid-template-columns:repeat(2,1fr);gap:12px}.c-bar{padding-top:18px}.c-bar select{width:100%}}

<style id="dqLoadCss">
/* first paint: our own loading screen while fonts, styles and products arrive (slow connections never see a broken page) */
#dqLoad{position:fixed;inset:0;z-index:2000;display:none;place-items:center;background:#18110A;color:#D0B48C;font-family:Georgia,'Times New Roman',serif}
:root[data-theme="light"] #dqLoad{background:#F6F1E9;color:#8A6438}
html.dq-loading #dqLoad{display:grid}
html.dq-loading body{overflow:hidden}
html.dq-loading body>*:not(#dqLoad){visibility:hidden}
html.dq-loading body>*:not(#dqLoad) *{animation-play-state:paused!important}
#dqLoad .c{display:flex;flex-direction:column;align-items:center;gap:18px;opacity:0;animation:dqlIn .6s ease .25s forwards}
#dqLoad svg{width:92px;height:95px;overflow:visible}
#dqLoad .ring{fill:none;stroke:currentColor;stroke-width:9;stroke-dasharray:500;stroke-dashoffset:500;animation:dqlDraw 1.6s cubic-bezier(.6,0,.2,1) .25s forwards}
#dqLoad .hand{stroke:currentColor;stroke-width:3;stroke-linecap:round;transform-origin:92px 92px;animation:dqlSpin 1.4s linear infinite}
#dqLoad .tail{stroke:currentColor;stroke-width:9;stroke-linecap:round}
#dqLoad b{font-weight:400;font-size:20px;letter-spacing:.5em;padding-left:.5em;color:#F5F0E8}
:root[data-theme="light"] #dqLoad b{color:#18110A}
#dqLoad .bar{width:140px;height:1px;background:rgba(208,180,140,.2);overflow:hidden;position:relative}
#dqLoad .bar i{position:absolute;inset:0;width:40%;background:currentColor;animation:dqlBar 1.2s ease-in-out infinite}
#dqLoad.out{animation:dqlOut .9s cubic-bezier(.7,0,.2,1) forwards;pointer-events:none}
#dqLoad.out .c{animation:dqlZoom .7s cubic-bezier(.7,0,.2,1) forwards}
@keyframes dqlIn{to{opacity:1}}
@keyframes dqlDraw{to{stroke-dashoffset:0}}
@keyframes dqlSpin{to{transform:rotate(360deg)}}
@keyframes dqlBar{from{transform:translateX(-110%)}to{transform:translateX(260%)}}
@keyframes dqlOut{0%{clip-path:circle(150% at 50% 50%)}100%{clip-path:circle(0% at 50% 50%)}}
@keyframes dqlZoom{to{opacity:0;transform:scale(1.25)}}
#dqBar{position:fixed;top:0;left:0;right:0;height:2px;z-index:2001;pointer-events:none;background:linear-gradient(90deg,transparent,#D0B48C,transparent);background-size:40% 100%;background-repeat:no-repeat;animation:dqlBar2 1.1s ease-in-out infinite;transition:opacity .4s}
#dqBar.done{opacity:0}
@keyframes dqlBar2{from{background-position:-40% 0}to{background-position:140% 0}}
@media (prefers-reduced-motion:reduce){#dqLoad *{animation-duration:0s!important}}
</style>
<script>
/* full loader on the first page of a visit; afterwards only a thin top bar */
(function(){var d=document.documentElement,first=true;try{first=sessionStorage.getItem('dq-seen')!=='1';sessionStorage.setItem('dq-seen','1')}catch(e){}
window.DQ_LOADER=first;if(first)d.classList.add('dq-loading');
setTimeout(function(){if(d.classList.contains('dq-loading')&&window.DQ_reveal)window.DQ_reveal();else d.classList.remove('dq-loading')},12000);})();

<script>
const { esc, finalPrice, discountPct } = RC;
const C = new URLSearchParams(location.search).get('c');
const PAGE = RC.pages[C] && C !== 'luxury' ? C : null;
if (!PAGE) location.replace(C === 'luxury' ? 'luxury.html' : './');
let tab = 'all', sort = 'default';
DQ.start(PAGE, () => {
  if (!PAGE) return;
  const all = DQ.pageItems(PAGE);
  // a page with no photographed products doesn't exist
  const K = RC.pageCfg(PAGE, DQ.settings);
  if ((K.off || !all.length) && !DQ.loadError) return location.replace('./');
  const V = RC.pages[PAGE];
  document.title = `${V.ar} · DAQQA | دقّة`;
  document.getElementById('ogTitle').content = document.title;
  document.getElementById('canon').href = location.origin + location.pathname + '?c=' + PAGE;
  const kinds = Object.keys(RC.kinds).filter(k => all.some(p => RC.kindOf(p) === k));
  const sub = K.sub || `${RC.arJoin(kinds.map(k => RC.kinds[k].ar))} ${K.tail}`;
  const pics = all.slice(0, 3), cover = ((DQ.settings.banners || {})[PAGE] || {}).hero;
  document.getElementById('page').innerHTML = `
  <section class="c-hero ${cover ? 'has-cover' : ''}" data-glow>${cover ? `<div class="c-cover" style="background-image:url('${esc(cover)}')"></div>` : ''}<div class="big" aria-hidden="true">${V.en.toUpperCase()}</div><div class="wrap">
    <div class="op op-stagger">
      <div class="mini-brand"><b>DAQQA</b><small>${V.en.toUpperCase()}</small></div>
      <h1 class="en" dir="ltr" style="text-align:right">${esc(K.en)}</h1>
      <div class="ar">${V.ar} — ${esc(K.ar)}</div>
      <p>${esc(sub)}</p>
      <div class="count en"><b>${all.length}</b> PIECES · ${kinds.map(k => RC.kinds[k].en.toUpperCase()).join(' · ')}</div>
    </div>
    ${cover ? '' : `<div class="c-stack op op-curtain" aria-hidden="true">${pics.map(p => `<img ${DQ.thumb(p)} alt="">`).join('')}</div>`}
  </div></section>
  <section class="strip" data-glow><div class="wrap">
    <div class="c-bar">
      <div class="tabs" role="tablist">${[['all', 'الكل', all.length], ...kinds.map(k => [k, RC.kinds[k].ar, all.filter(p => RC.kindOf(p) === k).length])].map(([k, l, n]) => `<button role="tab" data-tab="${k}" class="${k === tab ? 'on' : ''}">${l}<small>${n}</small></button>`).join('')}${all.some(RC.onOffer) ? `<button role="tab" data-tab="sale">العروض</button>` : ''}</div>
      <select id="sort" aria-label="ترتيب"><option value="default">الترتيب: المميز</option><option value="low">السعر: من الأقل</option><option value="high">السعر: من الأعلى</option><option value="off">أعلى خصم</option><option value="az">أبجدي ⁦A-Z⁩</option><option value="za">أبجدي ⁦Z-A⁩</option></select>
    </div>
    <div class="c-grid"><div class="grid" id="grid"></div></div>
  </div></section>`;
  const draw = () => {
    let list = all.filter(p => tab === 'all' ? true : tab === 'sale' ? RC.onOffer(p) : RC.kindOf(p) === tab);
    if (sort === 'low') list = [...list].sort((a, b) => finalPrice(a) - finalPrice(b));
    if (sort === 'high') list = [...list].sort((a, b) => finalPrice(b) - finalPrice(a));
    if (sort === 'off') list = [...list].sort((a, b) => discountPct(b) - discountPct(a));
    if (sort === 'az' || sort === 'za') { const by = (a, b) => String(a.name || '').localeCompare(String(b.name || ''), 'en', { sensitivity: 'base', numeric: true }); list = [...list].sort(sort === 'az' ? by : (a, b) => by(b, a)); }
    document.getElementById('grid').innerHTML = list.length ? list.map(DQ.card).join('') : `<div class="c-empty">مفيش منتجات هنا دلوقتي.</div>`;
    DQ.renderFavs && DQ.renderFavs(); DQ.reveal();
  };
  document.querySelector('.c-bar .tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; document.querySelectorAll('.c-bar .tabs button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
  document.getElementById('sort').onchange = e => { sort = e.target.value; draw(); };
  draw();
});
</script>
