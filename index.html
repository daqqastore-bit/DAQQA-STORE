<script>

const G_KEY = 'dq-strip-g'; let gMem = {}; try { gMem = JSON.parse(sessionStorage.getItem(G_KEY) || '{}') || {}; } catch (e) {}

(function landing() {
  const L = document.getElementById('landing');
  const desktop = matchMedia('(min-width:901px) and (pointer:fine)').matches;
  if (!desktop) { L.remove(); return; }
  window.DQ_NO_INTRO = true;

  const letters = [...document.querySelectorAll('#ldWord span')], fades = [...L.querySelectorAll('.ld-fade')], stage = L.querySelector('.ld-stick'), ring = document.getElementById('ldRing');
  const hand = c => dial.querySelector('.' + c);

  let p = 0, held = null;
  // real Egypt time (Africa/Cairo, follows DST automatically)
  const CF = new Intl.DateTimeFormat('en-GB', { timeZone: 'Africa/Cairo', hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
  const cairo = d => { const o = {}; CF.formatToParts(d).forEach(x => o[x.type] = +x.value); return { h: o.hour % 24, m: o.minute, s: o.second }; };
  const clk = document.getElementById('ldClock'), ap = document.getElementById('ldAP'); let lastS = -1;

  // geometry is measured once (and on resize) instead of every frame
  function measure() {
    let sx = 0, sy = 0, el = dial.parentNode; while (el && el !== stage) { sx += el.offsetLeft; sy += el.offsetTop; el = el.offsetParent; }
    const nav = document.getElementById('hdr'), sw = dial.parentNode.offsetWidth, sh = dial.parentNode.offsetHeight;

    const nav = document.getElementById('hdr'), secs = document.getElementById('sections'), navH = nav ? nav.offsetHeight : 0;
    // the stage is pinned right under the header from the first pixel, so nothing slides up before the clock moves
    if (Math.abs(stage.offsetHeight - (vhc - navH)) > 1) { stage.style.height = (vhc - navH) + 'px'; L.style.height = vhc * 2.6 + 'px'; geo = null; }
    const r = L.getBoundingClientRect(), span = r.height - innerHeight;
    // progress starts at the very first pixel of scroll (not after the top bar and header have scrolled by), and still ends where the store is released
    const y0 = scrollY + r.top; p = clamp(scrollY / (y0 + span));
    const fix = p < 1;
    L.style.setProperty('--navh', navH + 'px');
    if (secs) {
      if (fix !== held) { held = fix; Object.assign(secs.style, fix ? { position: 'fixed', left: '0', right: '0', zIndex: '1' } : { position: '', top: '', left: '', right: '', zIndex: '' }); }
      if (fix) secs.style.top = navH + 'px';
      L.style.marginBottom = (-stage.offsetHeight + (fix ? secs.offsetHeight : 0)) + 'px';
    }
    if (asleep && p < 1) { asleep = false; requestAnimationFrame(frame); }
    // once the store is released the intro must already be fully open
    if (p >= 1 && pv < 1) { pv = 1; render(1); }
  }
  addEventListener('scroll', onScroll, { passive: true }); onScroll(); addEventListener('resize', () => { geo = null; onScroll(); }); const _s = document.getElementById('sections'); if (_s && window.ResizeObserver) new ResizeObserver(onScroll).observe(_s); requestAnimationFrame(frame);
  // links to a section (#glasses, #watches-shop …): the store sits under the intro, so scroll past it to the section
  // slow eased glide (the rail asks for a calm ~3s descent instead of the browser's quick jump); any wheel/touch/key hands control back
  const glide = (top, ms) => {
    const y0 = scrollY, d = top - y0, t0 = performance.now(); let stop = false;
    const quit = () => { stop = true; ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(e => removeEventListener(e, quit)); };
    ['wheel', 'touchstart', 'keydown', 'mousedown'].forEach(e => addEventListener(e, quit, { passive: true }));
    const step = now => { if (stop) return; const k = Math.min(1, (now - t0) / ms), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;

    requestAnimationFrame(step);
  };
  document.getElementById('ldRail').onclick = () => { const first = document.querySelector('#sections > section.kind[id]:not([hidden])'); if (!(first && DQ_goto(first.id, true, 3200))) glide(scrollY + innerHeight, 3200); };
  window.DQ_goto = (id, smooth = true, ms = 0) => {
    const t = document.getElementById(id), secs = document.getElementById('sections');
    if (!t || !document.body.contains(L) || !secs.contains(t)) return false;
    const r = L.getBoundingClientRect(), end = scrollY + r.top + r.height - innerHeight;   // scroll where the store is released
    const nav = document.getElementById('hdr'), navB = nav ? nav.getBoundingClientRect().height : 0;
    const off = t.getBoundingClientRect().top - secs.getBoundingClientRect().top;
    const Z = parseFloat(getComputedStyle(document.documentElement).zoom) || 1;
    const top = Math.max(0, end + off + (navB - (nav ? nav.offsetHeight * Z : 0)));

    return true;
  };
  // scroll-spy: the address bar and the active menu item follow the section on screen (top = home, no hash)
  let spyT = 0;
  const spy = () => {
    const secs = [...document.querySelectorAll('#sections > section.kind[id]')].filter(x => !x.hidden);
    const nav = document.getElementById('hdr'), line = (nav ? nav.getBoundingClientRect().bottom : 0) + innerHeight * .25;
    let cur = 'home';
    if (L.getBoundingClientRect().bottom <= innerHeight + 2) secs.forEach(x => { if (x.getBoundingClientRect().top <= line) cur = x.id; });
    document.querySelectorAll('.links a[data-kind], .menu-list a[data-kind]').forEach(a => a.classList.toggle('on', a.dataset.kind === cur));
    const want = cur === 'home' ? location.pathname + location.search : '#' + cur;
    if ((cur === 'home' ? '' : '#' + cur) !== location.hash) history.replaceState(null, '', want);
  };
  addEventListener('scroll', () => { if (spyT) return; spyT = requestAnimationFrame(() => { spyT = 0; spy(); }); }, { passive: true });
  setTimeout(spy, 1200);
  addEventListener('hashchange', () => { const id = decodeURIComponent(location.hash.slice(1)); if (id) DQ_goto(id); });
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href*="#"]'); if (!a || e.defaultPrevented || e.button || e.metaKey || e.ctrlKey) return;
    const u = new URL(a.getAttribute('href'), location.href);
    const np = x => x.replace(/index\.html$/, ''); if (np(u.pathname) !== np(location.pathname) || !u.hash) return;
    if (DQ_goto(decodeURIComponent(u.hash.slice(1)))) { e.preventDefault(); history.replaceState(null, '', u.hash); }
  });
  L.addEventListener('pointermove', e => { L.style.setProperty('--mx', e.clientX / innerWidth * 100 + '%'); L.style.setProperty('--my', e.clientY / innerHeight * 100 + '%'); });
})();


// the house motto — «متبقاش دقّة قديمة» — a quiet, luxurious full-width moment before the footer
function MOTTO() {
  const ticks = Array.from({ length: 61 }, (_, i) => `<i class="${i % 5 ? '' : 'big'}"></i>`).join('');
  return `<section class="motto" data-glow aria-label="متبقاش دقّة قديمة">
    <div class="mo-bezel" aria-hidden="true"><div class="mo-ticks">${ticks}${ticks}</div><span class="mo-hand"></span></div>
    <div class="wrap mo-in op op-stagger">
      <span class="mo-cap en">DAQQA · A NEW KIND OF PRECISION</span>
      <h2 class="mo-line"><span>متبقاش</span> <span class="gold">دقّة</span> <span>قديمة.</span></h2>
      <p class="mo-sub">كل دقيقة بقيمتها، وكل قطعة بتتعمل عشان تفضل معاك.</p>
      <div class="mo-sign"><span></span><b class="en">D · Q</b><span></span></div>
    </div></section>`;
}
// section photos come from Admin → Settings (banners); without them the banner frames a product photo
function pick(k, list) {
  const set = (DQ.settings.banners || {})[k] || {};
  const ph = list.filter(p => p.images && p.images.length).sort((a, b) => (b.featured - a.featured) || (a.sort - b.sort));
  return { hero: set.hero || '', life: set.life || '', product: ph[0] };
}
function itemsFor(k) {
  const st = state[k];
  let list = DQ.products.filter(p => RC.kindOf(p) === k && !RC.isLuxury(p)).sort((a, b) => (b.featured - a.featured) || (a.sort - b.sort));
  if (st.tab === '__sale') list = list.filter(RC.onOffer);
  else if (st.tab !== 'all') list = list.filter(p => (p.style || '') === st.tab);
  if (st.g !== 'all') list = list.filter(p => p.category === st.g || p.category === 'unisex');
  return list;
}
function renderStrip(k) {
  const st = state[k], list = itemsFor(k), grid = document.querySelector(`#${k} .grid`);
  grid.classList.toggle('clip', !st.all);
  grid.innerHTML = list.length ? list.map(DQ.card).join('') : `<div class="empty">مفيش منتجات هنا.</div>`;
  document.querySelectorAll(`#${k} .tabs button`).forEach(b => b.classList.toggle('on', b.dataset.tab === st.tab));
  document.querySelectorAll(`#${k} .gseg button`).forEach(b => { const on = b.dataset.g === st.g; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
  const va = document.querySelector(`#${k} .view-all`);
  va.hidden = list.length <= 4;
  va.querySelector('span').textContent = st.all ? 'عرض أقل' : `عرض الكل (${list.length})`;
  DQ.renderFavs(); DQ.reveal();
}
// «قصة الأقسام» from the dashboard: photo + headline + text + numbers at the end of a section
function storyHTML(k) {
  const d = ((DQ.settings && DQ.settings.stories) || {})[k]; if (!d || d.on === false || !(d.title || d.body)) return '';
  const paras = String(d.body || '').split(/\n\s*\n/).map(x => x.trim()).filter(Boolean), stats = (d.stats || []).filter(x => x && (x.v || x.l)).slice(0, 4);
  return `<div class="story" data-glow><div class="wrap story-in ${d.img ? '' : 'no-img'}">
    <div class="story-txt op op-stagger">${d.cap ? `<span class="story-cap" dir="auto">${esc(d.cap)}</span>` : ''}${d.title ? `<h2 dir="auto">${esc(d.title)}</h2>` : ''}
      ${paras.map(t => `<p dir="auto">${esc(t)}</p>`).join('')}
      ${stats.length ? `<div class="story-stats">${stats.map(x => `<div><b class="en">${esc(x.v)}</b><span dir="auto">${esc(x.l)}</span></div>`).join('')}</div>` : ''}</div>
    ${d.img ? `<div class="story-pic op op-zoom"><img src="${esc(d.img)}" alt="${esc(d.title || '')}" loading="lazy"></div>` : ''}</div></div>`;
}
function build() {
  const live = DQ.liveKinds();
  if (!live.length) { $('#sections').innerHTML = `<div class="none"><div class="m">${RC.logo()}</div>${DQ.loadError ? 'حصلت مشكلة في التحميل. جرّب تعمل ريفريش.' : 'المنتجات جاية قريب.'}</div>`; return; }
  $('#sections').innerHTML = live.map((k, i) => {
    const K = RC.kinds[k], B = RC.band(k, DQ.settings), all = DQ.products.filter(p => RC.kindOf(p) === k && !RC.isLuxury(p)), img = pick(k, all);
    const rank = s => { const i = K.styles.indexOf(s); return i < 0 ? 99 : i; };
    const styles = [...new Set(all.map(p => p.style).filter(Boolean))].sort((a, b) => rank(a) - rank(b));
    const sale = all.some(RC.onOffer);
    state[k] = state[k] || { tab: 'all', all: false, g: ['men', 'women'].includes(gMem[k]) ? gMem[k] : 'all' };
    return `<section class="kind ${i ? '' : 'section-first'}" id="${k}" aria-label="${K.ar}">
      <div data-glow class="banner op ${img.hero ? 'has-photo op-curtain op-zoom' : 'framed op-curtain'}" ${img.hero ? 'data-parallax' : ''}>${img.hero ? `<div class="bg" style="--img:url('${esc(img.hero)}')"></div>` : ''}
        <div class="wrap ${img.hero ? '' : 'bn-grid'}"><div class="txt op op-stagger">
          <div class="mini-brand"><b>DAQQA</b><small>${K.en.toUpperCase()}</small></div>
          <h2 class="en" dir="ltr" style="text-align:right">${K.banner.en}</h2>
          <div class="ar">${K.banner.ar}</div>
          <p>${K.banner.sub}</p>
          <a class="btn-line" href="#${k}-shop">${K.banner.cta} ${DQ.ICON.arrow}</a>
        </div>${img.hero ? '' : `<a class="frame op op-arch" href="${RC.productUrl(img.product)}" aria-label="${esc(img.product.name)}"><span class="fr-card"><span class="fr-tag en">FEATURED</span><img src="${esc(img.product.images[0])}" alt="${esc(img.product.name)}"></span><span class="fr-cap"><span><b>${esc(img.product.name)}</b><small>${DQ.priceTxt(img.product)}</small></span><i>${DQ.ICON.arrow}</i></span></a>`}</div></div>
      <div class="strip" data-glow id="${k}-shop"><div class="wrap strip-in">
        <div class="strip-head op op-stagger"><h3 class="en">${K.en}<small>${K.ar}</small></h3><button class="view-all" data-va="${k}"><span>عرض الكل</span> ${DQ.ICON.arrow}</button></div>
        <div class="tabs-row"><div class="gseg op op-stagger" role="group" aria-label="الفئة">${[['all', 'الكل'], ['men', 'رجالي'], ['women', 'حريمي']].map(([g, l]) => `<button type="button" data-g="${g}" data-k="${k}">${l}</button>`).join('')}</div>
        <div class="tabs op op-stagger" role="tablist">
          <button data-tab="all" data-k="${k}" class="on">الكل</button>
          ${styles.map(s => `<button class="en" data-tab="${esc(s)}" data-k="${k}">${esc(s)}</button>`).join('')}
          ${sale ? `<button data-tab="__sale" data-k="${k}">العروض</button>` : ''}
        </div></div>
        <div class="grid clip"></div>
      </div></div>
      <div data-glow class="band op op-drop ${img.life ? 'has-photo op-zoom' : 'plain'}" ${img.life ? 'data-parallax' : ''}>${img.life ? `<div class="bg" data-ar="${esc(img.life)}" style="--img:url('${esc(img.life)}')"></div>` : `<div class="wm" aria-hidden="true">${RC.logo()}</div>`}
        <div class="wrap"><div class="op op-stagger"><div class="lbl en">DAQQA</div><h2 class="en" dir="ltr" style="text-align:right">${B.en}</h2><div class="ar">${B.ar}</div></div>
          <div class="feats op op-stagger" style="--n:${B.feats.length}">${B.feats.map(([ic, t, l]) => l ? `<a href="${RC.esc(l)}" ${/^https:/.test(l) ? 'target="_blank" rel="noopener"' : ''}>${RC.featIcon(ic)}<span>${t}</span></a>` : `<div>${RC.featIcon(ic)}<span>${t}</span></div>`).join('')}</div></div></div>
      ${storyHTML(k)}
    </section>`;
  }).join('') + MOTTO();
  live.forEach(renderStrip);
  // jump to the #section only on the first paint: live refreshes re-render this, and the scroll-spy keeps the hash updated, so jumping again would yank the visitor up to the section's top
  const h = DQ._hashDone ? '' : location.hash.slice(1); DQ._hashDone = true;
  if (h && !DQ.restoreY && document.getElementById(h)) { const go = () => { if (!(window.DQ_goto && DQ_goto(h, false))) document.getElementById(h).scrollIntoView(); }; setTimeout(go, 80); setTimeout(go, 700); }
  // product list for Google
  const base = location.origin + location.pathname.replace(/index\.html$/, '');
  const ld = { '@context': 'https://schema.org', '@type': 'ItemList', name: 'DAQQA Collection', itemListElement: DQ.products.map((p, i) => ({ '@type': 'ListItem', position: i + 1, url: base + RC.productUrl(p), name: p.name })) };
  const s = document.createElement('script'); s.type = 'application/ld+json'; s.textContent = JSON.stringify(ld); document.head.appendChild(s);
}
document.addEventListener('click', e => {
  const t = e.target.closest('.tabs [data-tab]');
  if (t) { state[t.dataset.k].tab = t.dataset.tab; renderStrip(t.dataset.k); }
  const g = e.target.closest('.gseg [data-g]');
  if (g) { const k = g.dataset.k; state[k].g = g.dataset.g; gMem[k] = g.dataset.g; try { sessionStorage.setItem(G_KEY, JSON.stringify(gMem)); } catch (er) {} renderStrip(k); }
  const v = e.target.closest('[data-va]');
  if (v) { const k = v.dataset.va; state[k].all = !state[k].all; renderStrip(k); }
});
DQ.onRefresh = build;
DQ.start(RC.kinds[location.hash.slice(1)] ? location.hash.slice(1) : 'home', build);
</script>
<script>
// phones show the strip photo whole: give each photo box the picture's own shape
(() => { const fit = () => document.querySelectorAll('.band .bg[data-ar]:not([data-ar-ok])').forEach(el => { el.dataset.arOk = 1; const im = new Image();
  im.onload = () => { if (im.naturalWidth && im.naturalHeight) el.style.setProperty('--ar', im.naturalWidth + ' / ' + im.naturalHeight); }; im.src = el.dataset.ar; });
