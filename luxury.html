.lx-pic .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 60%,rgb(var(--L-bgrgb)/.55));pointer-events:none}
.lx-pic .ph-dots{top:auto;bottom:18px}

.lx-pic .tag{position:absolute;top:18px;right:18px;z-index:2;font:600 9px var(--f-ui);letter-spacing:.4em;color:var(--L-on);background:linear-gradient(120deg,var(--lx-gold-2),var(--lx-gold));padding:8px 12px 8px 14px}
.lx-txt{position:relative;display:flex;flex-direction:column;gap:16px}
.lx-txt .kind{direction:ltr;text-align:right}
.lx-txt h2{font:400 clamp(36px,4vw,60px)/1.05 var(--f-display);color:var(--lx-ink);direction:ltr;text-align:right}
.lx-txt h2 a:hover{color:var(--lx-gold-2)}
.lx-txt .lead{font:400 21px/1.7 'Amiri',var(--f-ar);color:var(--lx-mute);max-width:460px}
.lx-specs{display:grid;gap:0;max-width:460px;margin-top:4px}
.lx-specs div{display:flex;align-items:baseline;gap:10px;padding:11px 0;border-bottom:1px solid var(--lx-line);font-size:14px}
.lx-specs span{color:var(--lx-mute)}
.lx-specs i{flex:1;border-bottom:1px dotted rgb(var(--L-rgb)/.3);transform:translateY(-4px)}
.lx-specs b{font-weight:600;color:var(--lx-ink)}
.lx-price{display:flex;align-items:baseline;gap:14px;margin-top:8px;font-family:var(--f-ui)}
.lx-price .now{font:500 34px var(--f-display)}
.lx-price s{color:var(--lx-mute);font-size:15px}
.lx-price .off{font:700 11px var(--f-ui);letter-spacing:.1em;color:var(--L-on);background:var(--lx-gold);padding:4px 10px;border-radius:999px}
.lx-sw{display:flex;gap:10px}
.lx-sw i{width:18px;height:18px;border-radius:50%;box-shadow:0 0 0 2px var(--lx-bg),0 0 0 3px rgb(var(--L-rgb)/.6)}
.lx-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.lx-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:54px;padding:0 30px;font-weight:700;font-size:15px;letter-spacing:.02em;transition:all .35s;position:relative;overflow:hidden}
.lx-btn svg{width:18px;height:18px}
.lx-btn.solid{background:linear-gradient(120deg,var(--lx-gold-3),var(--lx-gold) 45%,var(--lx-gold-2));color:var(--L-on)}
.lx-btn.solid:hover{filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 20px 40px -18px rgb(var(--L-rgb)/.6)}
.lx-btn.line{border:1px solid var(--lx-line);color:var(--lx-ink)}
.lx-btn.line:hover{border-color:var(--lx-gold);color:var(--lx-gold-2)}
.lx-btn.ico{width:54px;padding:0}
.lx-btn.ico.on{color:var(--lx-gold)}
.lx-out{color:var(--lx-mute);font-size:14px}

/* concierge */
.lx-cta{position:relative;text-align:center;padding:120px 20px;background:radial-gradient(ellipse at 50% 0%,var(--L-glow),var(--lx-bg) 70%);border-top:1px solid var(--lx-line)}
.lx-cta h3{font:400 clamp(34px,4.6vw,64px)/1.1 var(--f-display);direction:ltr}
.lx-cta p{font:400 22px 'Amiri',var(--f-ar);color:var(--lx-mute);margin:14px auto 30px;max-width:520px}
.site-foot{background:var(--lx-bg)!important}

/* cursor ring in gold here */
.cursor-ring{border-color:var(--lx-gold)!important}
@media (max-width:900px){
  .lx-hero{min-height:auto}.lx-frame{inset:12px}.lx-top{top:30px}
  .lx-center{padding:90px 16px 120px}.lx-dial{width:min(78vw,340px)}
  .lx-ch,.lx-ch.flip{grid-template-columns:1fr;padding:70px 0;gap:44px}.lx-ch.flip .lx-pic{order:0}
  .lx-top{letter-spacing:.3em;font-size:8px;white-space:nowrap}.lx-top span{width:28px}
  .lx-scroll{display:none}.lx-hero .meta{flex-wrap:wrap;justify-content:center;gap:8px 18px}
  .lx-ch .num{top:20px}.lx-pic{margin:0 18px}
  .lx-acts .lx-btn.solid{flex:1}
}
@media (prefers-reduced-motion:reduce){.gold,.lx-dial svg,.lx-marq div,.lx-scroll i{animation:none}}

<body>
<div class="lx-intro" id="lxIntro" aria-hidden="true">
  <div class="lxi-c">
    <svg class="lxi-dial" viewBox="0 0 200 200"><circle class="lxi-ring" cx="100" cy="100" r="86"/><circle class="lxi-ring2" cx="100" cy="100" r="92"/><g class="lxi-ticks"></g><line class="lxi-hand" x1="100" y1="100" x2="100" y2="22"/><circle cx="100" cy="100" r="2.6" fill="var(--L-gold2)"/></svg>
    <div class="lxi-word en">DAQQA <em>Privé</em></div>
    <div class="lxi-cap en">THE LUXURY COLLECTION</div>
  </div>
</div>
<script>
(function () {
  var el = document.getElementById('lxIntro'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches, quick = false;
  try { quick = sessionStorage.getItem('dq-lx') === '1'; sessionStorage.setItem('dq-lx', '1'); } catch (e) {}
  window.DQ_NO_INTRO = true;
  if (reduce) { el.remove(); return; }
  var g = el.querySelector('.lxi-ticks'), t = '';
  for (var i = 0; i < 60; i++) { var a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 72 : 77, r2 = 81; t += '<line style="--i:' + i + '" x1="' + (100 + r1 * Math.sin(a)) + '" y1="' + (100 - r1 * Math.cos(a)) + '" x2="' + (100 + r2 * Math.sin(a)) + '" y2="' + (100 - r2 * Math.cos(a)) + '" class="' + (big ? 'b' : '') + '"/>'; }
  g.innerHTML = t;
  if (quick) el.classList.add('quick');
  document.documentElement.classList.add('lx-intro-on');
  var done = function () { el.classList.add('open'); document.documentElement.classList.remove('lx-intro-on'); setTimeout(function () { el.remove(); }, 1300); };
  // open once the entrance has played AND the collection has loaded (capped so a slow line still opens)
  var T, t0 = Date.now(), min = quick ? 1300 : 2900, opened = false;
  var go = function () { if (opened) return; opened = true; clearTimeout(T); setTimeout(done, Math.max(0, min - (Date.now() - t0))); };
  T = setTimeout(go, 14000);
  (function wait() { if (window.DQ_READY) window.DQ_READY.then(go); else setTimeout(wait, 50); })();
  el.addEventListener('click', function () { if (!opened) { opened = true; clearTimeout(T); done(); } });
})();
</script>
<div id="hdr"></div>
<main id="page"><section class="lx-hero"><div class="lx-center"><div class="skeleton" style="width:320px;height:320px;border-radius:50%;opacity:.3"></div></div></section></main>
<div id="ftr"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/config.js?v=20261024132941"></script>
<script src="assets/app.js?v=20261024132941"></script>
<script>
const { esc, money, finalPrice, discountPct } = RC;
const ORDER = Object.keys(RC.kinds); // watches first
const ticks = () => { let s = ''; for (let i = 0; i < 60; i++) { const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 41 : 44, r2 = 47.5; s += `<line x1="${50 + r1 * Math.sin(a)}" y1="${50 - r1 * Math.cos(a)}" x2="${50 + r2 * Math.sin(a)}" y2="${50 - r2 * Math.cos(a)}" stroke="${big ? 'var(--L-gold2)' : 'var(--L-gold3)'}" stroke-width="${big ? .6 : .3}"/>`; } return s; };
let filter = 'all';
DQ.start('luxury', () => {
  const all = DQ.pageItems('luxury').sort((a, b) => (ORDER.indexOf(RC.kindOf(a)) - ORDER.indexOf(RC.kindOf(b))) || (b.featured - a.featured) || (finalPrice(b) - finalPrice(a)));
  // no luxury pieces with photos → the page doesn't exist
  if (!all.length && !DQ.loadError) return location.replace('./');
  const COV = DQ.settings.banners || {};
  const hero = all.find(p => RC.kindOf(p) === 'watches') || all[0];
  const kinds = ORDER.filter(k => all.some(p => RC.kindOf(p) === k));
  const gens = [['men', 'رجالي'], ['women', 'حريمي']];
  const lead = p => { const d = RC.splitDesc ? RC.splitDesc(p.description || '') : { text: p.description || '', specs: [] }; return d; };
  // Luxury pieces as a grid of Privé cards; the full editorial view lives on each product page
  const chapter = (p, i) => {
    const off = discountPct(p), url = RC.productUrl(p), n = (p.images || []).length, fav = DQ.favs.has(p.id);
    return `<article class="lx-card op op-stagger" data-pid="${p.id}">
      <a class="lc-pic" href="${url}" aria-label="${esc(p.name)}"><img ${DQ.thumb(p)} alt="${esc(p.name)}" loading="${i < 4 ? 'eager' : 'lazy'}">
        ${n > 1 ? `<span class="ph-dots" aria-hidden="true">${'<i></i>'.repeat(Math.min(n, 6))}</span>` : ''}
        ${p.featured ? '<span class="lc-tag en">SIGNATURE</span>' : ''}${off ? `<span class="lc-off en">-${off}%</span>` : ''}
        ${p.stock > 0 ? '' : '<span class="lc-out">نفدت الكمية</span>'}</a>
      <button class="lc-fav ${fav ? 'on' : ''}" data-fav="${p.id}" aria-label="المفضلة" aria-pressed="${fav}">${DQ.ICON.heart}</button><button type="button" class="lc-fav lc-eye" data-qv="${p.id}" aria-label="عرض سريع" title="عرض سريع">${DQ.QV_EYE}</button>
      <div class="lc-txt">
        <span class="lc-cap en">N° ${String(i + 1).padStart(2, '0')} · ${RC.kinds[RC.kindOf(p)].en}${p.style ? ' · ' + esc(p.style) : ''}</span>
        <h3 class="en"><a href="${url}">${esc(p.name)}</a></h3>
        <div class="lc-row"><div class="lc-price"><span class="gold">${money(finalPrice(p))}</span>${off ? `<s>${money(p.price)}</s>` : ''}</div>
          ${p.stock > 0 ? `<button class="lc-add" data-add="${p.id}" aria-label="أضف ${esc(p.name)} للسلة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" aria-hidden="true"><path d="M12 3.5v6.2M12 14.3v6.2M3.5 12h6.2M14.3 12h6.2"/><path d="M12 9.6 14.4 12 12 14.4 9.6 12Z" fill="currentColor" stroke="none"/></svg></button>` : ''}</div>
        ${RC.dotsHTML(p, 'sw lc-sw')}
      </div></article>`;
  };
  document.getElementById('page').innerHTML = `
  <section class="lx-hero" data-glow>
    <div class="lx-frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="lx-word" aria-hidden="true">Luxury</div>
    <div class="lx-top lx-cap"><span></span>DAQQA · PRIVÉ COLLECTION<span></span></div>
    <div class="lx-center">
      <a class="lx-dial" href="${RC.productUrl(hero)}" data-pid="${hero.id}" aria-label="${esc(hero.name)}">
        <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="48.5" fill="none" stroke="var(--L-gold)" stroke-width=".25"/>${ticks()}</svg>
        <span class="glow"></span><span class="pic ph"><img src="${esc(COV.luxury && COV.luxury.hero || DQ.img(hero))}" alt=""></span>
      </a>
      <h1 class="gold">DAQQA <em>Privé</em></h1>
      <div class="ar">الفخامة في كل دقّة.</div>
      <div class="meta"><span><b>${all.length}</b> PIECES</span><span>${kinds.map(k => RC.kinds[k].en.toUpperCase()).join(' · ')}</span></div>
    </div>
    <div class="lx-scroll en">SCROLL<i></i></div>
  </section>
  <div class="lx-marq" aria-hidden="true"><div>${('<span>DAQQA Privé</span><span>Luxury</span><span>' + kinds.map(k => RC.kinds[k].en).join('</span><span>') + '</span>').repeat(6)}</div></div>
  <div class="lx-shop">
  <nav class="lx-nav" aria-label="أقسام Luxury">${kinds.map((k, n) => `<a href="#lx-${k}"><em class="en">${['I', 'II', 'III'][n]}</em>${RC.kinds[k].ar}<span class="en">${RC.kinds[k].en}</span></a>`).join('')}${gens.length ? `<i class="lx-div" aria-hidden="true"></i><div class="lx-filters" role="tablist"><button data-f="all" class="on">الكل</button>${gens.map(([g, l]) => `<button data-f="g:${g}">${l}<span class="en">${g === 'men' ? 'HIM' : 'HER'}</span></button>`).join('')}</div>` : ''}</nav>

  <section class="wrap" id="chapters"></section>
  </div>
  <section class="lx-cta op op-stagger">
    <span class="lx-cap">PRIVATE SERVICE</span>
    <h3 class="gold">Reserved for You.</h3>
    <p>عاوز قطعة معينة أو تشوف صور أكتر قبل ما تطلب؟ كلمنا مباشرة.</p>
    ${DQ.wa() ? `<a class="lx-btn solid" href="https://wa.me/${DQ.wa()}?text=${encodeURIComponent('أهلاً، مهتم بمجموعة DAQQA Privé')}" target="_blank" rel="noopener">كلمنا على واتساب</a>` : `<a class="lx-btn solid" href="./">تسوّق كل المجموعات</a>`}
  </section>`;
  const draw = () => {
    const list = all.filter(p => filter === 'all' || p.category === filter.slice(2) || p.category === 'unisex');
    // one section per kind (watches first), each with its own chapter numbers
    document.getElementById('chapters').innerHTML = kinds.map((k, n) => { const items = list.filter(p => RC.kindOf(p) === k); if (!items.length) return '';
      const cv = (COV['lux-' + k] || {}).hero;
      return `<section class="lx-sec" id="lx-${k}">${cv ? `<div class="lx-cover op op-curtain"><img src="${esc(cv)}" alt="" loading="lazy"></div>` : ''}<header class="lx-sec-h op op-stagger"><span class="lx-cap">N° ${['I', 'II', 'III'][n]} · DAQQA PRIVÉ</span><h2 class="gold en">${RC.kinds[k].en}</h2><p>${RC.kinds[k].ar}</p></header><div class="lx-grid">${items.map(chapter).join('')}</div></section>`; }).join('') || `<div class="lx-none"><span class="en">COMING SOON</span><b>قريبًا</b></div>`;
    DQ.reveal();
  };
  const f = document.querySelector('.lx-filters');
  if (f) f.onclick = e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; f.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); draw(); };
  draw();
  DQ.onRefresh = () => {};
});
</script>
