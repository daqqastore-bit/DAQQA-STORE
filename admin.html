<!doctype html>

<head>
<meta charset="utf-8">

<title>لوحة التحكم | DAQQA STORE - دقّة ستور</title>

<script>try{const t=localStorage.getItem('rc-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
body{font-size:14px}
.hidden{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 30%,var(--glow),transparent 60%)}
.login form{width:min(380px,100%);background:var(--bg-2);border:1px solid var(--line);border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:14px}
.login .m{width:84px;height:84px;margin:0 auto 6px}
.login h1{text-align:center;font:500 20px 'Bodoni Moda',serif;letter-spacing:.32em;color:var(--ink)}
.login p{text-align:center;color:var(--muted);font-size:13px;margin-top:-8px}
/* shell */
.app{display:flex;min-height:100vh}
.side{width:240px;flex:none;background:var(--bg-2);border-left:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 8px}
/* theme switch sits next to the brand so it is always in view */
.th-sw{margin-inline-start:auto;position:relative;width:58px;height:30px;flex:none;border-radius:99px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 7px;direction:ltr;color:var(--muted);cursor:pointer;transition:border-color .3s}
.th-sw:hover{border-color:var(--amber)}
.th-sw svg{width:14px;height:14px;position:relative;z-index:1;transition:color .3s}
.th-sw::before{content:"";position:absolute;top:3px;width:22px;height:22px;border-radius:50%;background:var(--amber);left:3px;transition:left .35s cubic-bezier(.3,.7,.2,1)}
:root[data-theme="light"] .th-sw::before{left:31px}
.th-sw .mo{color:var(--amber-ink)}:root[data-theme="light"] .th-sw .mo{color:var(--muted)}:root[data-theme="light"] .th-sw .su{color:var(--amber-ink)}
.side .brand .m{width:36px;height:37px}
.side .brand div{line-height:1.2;text-align:left;direction:ltr}
.side .brand b{font:500 17px 'Bodoni Moda',serif;letter-spacing:.3em;display:block}
.side .brand small{font:600 10px var(--f-ui);letter-spacing:.3em;color:var(--amber)}
.tabs{display:flex;flex-direction:column;gap:4px}
.tab{height:44px;padding:0 14px;border-radius:10px;display:flex;align-items:center;gap:10px;color:var(--muted);text-align:right;width:100%;transition:background .2s,color .2s}
.tab svg{width:18px;height:18px;flex:none}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--surface-2);color:var(--ink);font-weight:600}
.tab .pill{margin-inline-start:auto;background:var(--amber);color:var(--amber-ink);font:700 11px/20px var(--f-ui);min-width:22px;text-align:center;border-radius:999px;padding:0 6px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side .foot a,.side .foot button{height:40px;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted);font-size:13px}
.side .foot a:hover,.side .foot button:hover{color:var(--ink);background:var(--surface)}
.side .foot svg{width:17px;height:17px}
main{flex:1;min-width:0;padding:28px 32px 60px}
.head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:24px;font-weight:700}
.head .sub{color:var(--muted);font-size:13px}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap}
.seg button{height:34px;padding:0 14px;border-radius:999px;color:var(--muted);font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.panel h2{font-size:16px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.panel h2 small{font-size:12px;color:var(--muted);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.kpi span{font-size:13px;color:var(--muted)}
.kpi b{display:block;font:700 26px/1.3 var(--f-ui);direction:ltr;text-align:right}
.kpi small{font-size:12px;color:var(--muted-2)}
.row2{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px}
.row2 > .panel:first-child{flex:2 1 460px;min-width:0}
.row2 > .panel:last-child{flex:1 1 280px;min-width:0}
.chart-box{position:relative;height:260px}
.bar-row{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.bar-row div:first-child{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.bar-row .track{height:6px;border-radius:9px;background:var(--line)}
.bar-row .track i{display:block;height:100%;border-radius:9px;background:var(--amber)}
.status-dots{display:flex;flex-wrap:wrap;gap:10px}
.sd{display:flex;align-items:center;gap:8px;font-size:13px;padding:8px 12px;border:1px solid var(--line);border-radius:10px}
.sd i{width:10px;height:10px;border-radius:50%}
.sd{background:transparent;color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}.sd:hover{border-color:var(--c)}
.sd svg{width:14px;height:14px;color:var(--muted);transition:transform .25s}.sd.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}.sd.on svg{transform:rotate(180deg)}
.sd-list{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:6px;display:grid;gap:2px;max-height:340px;overflow:auto;animation:sdIn .25s ease}
@keyframes sdIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.sd-row{display:grid;grid-template-columns:110px 1fr auto auto;gap:14px;align-items:center;padding:10px 12px;border-radius:10px;text-align:right;color:var(--ink);font-size:13.5px}
.sd-row:hover{background:var(--surface-2)}.sd-row .c{font-weight:700;font-size:12.5px}.sd-row .d{color:var(--muted);font-size:12px}.sd-row b{font-family:var(--f-ui)}
@media(max-width:700px){.sd-row{grid-template-columns:1fr auto}.sd-row .d{grid-column:1}.sd-row .w{display:none}}
/* status colors */
.st-new{--c:#e0b47a}.st-confirmed{--c:var(--blue)}.st-shipped{--c:#c9a0f0}.st-delivered{--c:var(--green)}.st-cancelled{--c:var(--red)}.st-returned{--c:#d9925a}
:root[data-theme="light"] .st-new{--c:#a9702d}:root[data-theme="light"] .st-shipped{--c:#7b4cb8}
.badge{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--c);color:var(--c);font-size:12px;font-weight:600}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
/* orders */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.ord-prod{height:40px;width:auto;max-width:280px;padding:0 14px;border-radius:999px;font-size:13px}
.search{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border:1px solid var(--line-2);border-radius:999px;color:var(--muted);flex:1 1 240px;max-width:360px}
.search input{border:0;background:transparent;outline:none;width:100%;color:var(--ink)}
.search svg{width:16px;height:16px;flex:none}
.orders{display:flex;flex-direction:column;gap:10px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .2s}
.order.fresh{animation:fresh 2.5s}
@keyframes fresh{0%,40%{border-color:var(--amber);box-shadow:0 0 0 3px var(--glow)}}
.o-top{display:grid;grid-template-columns:150px 1fr 120px 130px 150px 24px;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.o-top .code{font:600 12px var(--f-ui);direction:ltr;text-align:right}
.o-top .date{font-size:11px;color:var(--muted-2)}
.o-top .who b{display:block}
.warn-chip{display:inline-block;margin-inline-start:8px;font:600 11px var(--f-ui);font-style:normal;color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);padding:2px 8px;border-radius:99px;vertical-align:middle}
.cx-box{border-radius:12px;padding:10px 12px;background:var(--surface-2);display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.cx-box b{color:var(--ink);font-size:13px}.cx-box.warn{background:color-mix(in srgb,var(--red) 10%,transparent);border:1px solid color-mix(in srgb,var(--red) 30%,transparent)}.cx-box.warn b{color:var(--red)}
.o-top .who span{font:12px var(--f-ui);color:var(--muted);direction:ltr;display:inline-block}
.o-top .total{font:700 14px var(--f-ui)}
.o-top .chev{transition:transform .25s;color:var(--muted)}
.order.open .chev{transform:rotate(180deg)}
.o-body{display:none;border-top:1px solid var(--line);padding:16px;gap:18px;flex-wrap:wrap}
.order.open .o-body{display:flex}
.o-items{flex:2 1 320px;display:flex;flex-direction:column;gap:10px}
.o-item{display:flex;gap:10px;align-items:center}
.o-item img{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--surface-2)}
.o-item .n{flex:1;font:600 13px var(--f-ui)}
.o-item .q{color:var(--muted);font:13px var(--f-ui)}
.o-sum{border-top:1px dashed var(--line-2);padding-top:10px;display:grid;gap:4px;font-size:13px;color:var(--muted)}
.o-sum div{display:flex;justify-content:space-between}
.o-sum b{color:var(--ink);font-family:var(--f-ui)}
.o-side{flex:1 1 260px;display:flex;flex-direction:column;gap:10px}
.o-side .addr{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.o-side .acts{display:flex;gap:8px;flex-wrap:wrap}
.o-side .addr .loc-link{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:var(--amber);font-weight:600}
.o-side .addr .loc-link svg{width:15px;height:15px}
/* status picker */
.order:has(.stp.open){overflow:visible;position:relative;z-index:6}
.stp{position:relative}
.stp-btn{width:100%;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:600;transition:border-color .2s,box-shadow .2s}
.stp-btn i,.stp-pop i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 18%,transparent);flex:none}
.stp-btn svg{width:16px;height:16px;margin-inline-start:auto;color:var(--muted);transition:transform .25s}
.stp.open .stp-btn{border-color:var(--amber);box-shadow:0 0 0 3px var(--glow)}
.stp.open .stp-btn svg{transform:rotate(180deg)}
.stp-pop{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);box-shadow:0 18px 40px -14px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:2px;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .2s,transform .2s}
.stp.open .stp-pop{opacity:1;transform:none;pointer-events:auto}
.stp-pop button{height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:9px;font-size:14px;color:var(--ink);text-align:right}
.stp-pop button:hover{background:var(--surface-2)}
.stp-pop button.on{background:color-mix(in srgb,var(--c) 14%,transparent);font-weight:700}
.stp-pop button svg{width:15px;height:15px;margin-inline-start:auto;color:var(--c);visibility:hidden}
.stp-pop button.on svg{visibility:visible}
.fin-chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 10px;border-radius:10px;background:var(--surface-2);color:var(--muted)}
.fin-chip b{font-family:var(--f-ui);color:var(--green)}.fin-chip b.neg{color:var(--red)}
/* order costs popup */
.fin-m{position:fixed;inset:0;z-index:125;display:grid;place-items:center;padding:18px;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);animation:fmIn .25s ease}
@keyframes fmIn{from{opacity:0}}
.fin-box{width:min(520px,100%);max-height:calc(100dvh - 36px);overflow:auto;background:var(--bg-2);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;animation:fbIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes fbIn{from{transform:translateY(16px) scale(.98);opacity:0}}
.fin-box h3{font-size:18px;display:flex;align-items:center;gap:10px}
.fin-box h3 .en{font-size:13px;color:var(--amber);font-weight:600;letter-spacing:.04em}
.fin-box .fsub{font-size:13px;color:var(--muted);line-height:1.7;margin-top:-8px}
.fin-items{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:14px}
.fin-h{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:0 2px 2px}
.fin-pc{display:grid;gap:4px}.fin-pc span{font-size:11px;color:var(--muted)}
.o-fin{margin-top:14px;border-radius:14px;padding:14px;background:var(--surface-2);display:grid;gap:6px;font-size:13px;color:var(--muted)}
.o-fin h4{margin:0 0 2px;font-size:14px;color:var(--ink)}
.o-fin>div{display:flex;justify-content:space-between;gap:10px}
.o-fin b{font-family:var(--f-ui);color:var(--ink)}.o-fin b i{font-style:normal;font-weight:400;color:var(--muted-2);font-size:11.5px}
.o-fin .net{border-top:1px solid var(--line);padding-top:8px;margin-top:2px;font-size:14.5px;color:var(--ink);font-weight:700}
.o-fin .net b{font-size:16px;color:var(--green)}.o-fin b.neg,.o-fin .net b.neg{color:var(--red)}
.o-fin small{font-size:12.5px}.o-fin.warn small{color:var(--amber)}.o-fin .btn{justify-self:start;margin-top:4px}
.fin-it{display:grid;grid-template-columns:40px 1fr 140px;gap:10px;align-items:center}
.fin-it img{width:40px;height:40px;border-radius:9px;object-fit:cover;background:var(--surface-2)}
.fin-it b{font:600 13px var(--f-ui);display:block}.fin-it small{font-size:11.5px;color:var(--muted)}
.fin-it .input{height:40px;font-family:var(--f-ui)}
.fin-box .field .input{font-family:var(--f-ui)}
.who-pays{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who-pays button{min-height:56px;border:1px solid var(--line-2);border-radius:12px;padding:8px 12px;text-align:right;display:flex;flex-direction:column;gap:2px;transition:border-color .2s,background .2s}
.who-pays button b{font-size:14px}.who-pays button small{font-size:11.5px;color:var(--muted)}
.who-pays button.on{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,transparent)}
.fin-calc{border-radius:14px;padding:14px;background:var(--surface);border:1px dashed var(--line-2);display:grid;gap:6px;font-size:13px;color:var(--muted)}
.fin-calc div{display:flex;justify-content:space-between}
.fin-calc b{font-family:var(--f-ui);color:var(--ink)}
.fin-calc .net{border-top:1px solid var(--line);padding-top:8px;font-size:15px;color:var(--ink);font-weight:700}
.fin-calc .net b{font-size:18px;color:var(--green)}.fin-calc .net b.neg{color:var(--red)}
.fin-acts{display:flex;gap:8px}
.fin-acts .btn{flex:1}
/* accounts */
.acc-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 18px;overflow-x:auto}
.acc-tabs button{height:44px;padding:0 16px;color:var(--muted);font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.acc-tabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--amber)}
.kpi.net{border-color:color-mix(in srgb,var(--green) 55%,transparent);background:color-mix(in srgb,var(--green) 12%,var(--surface))}
.kpi.net b{color:var(--green);font-size:30px}.kpi.net.neg{border-color:color-mix(in srgb,var(--red) 55%,transparent);background:color-mix(in srgb,var(--red) 10%,var(--surface))}.kpi.net.neg b{color:var(--red)}
.kpi b.minus{color:var(--red)}
.warn-box{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--amber) 55%,transparent);background:color-mix(in srgb,var(--amber) 9%,transparent);margin-bottom:14px;font-size:13.5px}
.flow{display:flex;flex-direction:column;gap:12px}
.flow-row{display:grid;grid-template-columns:150px 1fr 90px;gap:12px;align-items:center;font-size:13.5px}
.flow-row span:last-child{font:700 13px var(--f-ui);text-align:left;direction:ltr}
.flow-row .tr{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.flow-row .tr i{display:block;height:100%;border-radius:9px;background:var(--amber)}
.flow-row.minus .tr i{background:var(--red)}.flow-row.minus span:last-child{color:var(--red)}
.flow-row.sum{border-top:1px solid var(--line);padding-top:12px;font-weight:700}.flow-row.sum .tr i{background:var(--green)}.flow-row.sum span:last-child{color:var(--green)}
.atable{width:100%;border-collapse:collapse;min-width:760px;font-size:13.5px}
.atable th{text-align:right;color:var(--muted);font-weight:500;font-size:12.5px;padding:10px 8px;border-bottom:1px solid var(--line)}
.atable td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.atable td.n{font-family:var(--f-ui);white-space:nowrap}
.atable .pos{color:var(--green);font-weight:700}.atable .neg{color:var(--red);font-weight:700}
.atable .miss{color:var(--amber);font-size:12.5px}
.cat{position:relative}.cat .input{padding-inline-end:40px}
.cat-tg{position:absolute;inset-inline-end:6px;top:50%;translate:0 -50%;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.cat-tg svg{width:16px;height:16px;transition:transform .25s}.cat.open .cat-tg svg{transform:rotate(180deg)}
.cat.open .input{border-color:var(--amber);box-shadow:0 0 0 3px var(--glow)}
.cat-pop{position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:20;max-height:260px;overflow:auto;padding:6px;border:1px solid var(--line);border-radius:14px;background:var(--bg-2);box-shadow:0 18px 40px -14px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:2px;opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:opacity .2s,transform .2s}
.cat.open .cat-pop:not(:empty){opacity:1;transform:none;pointer-events:auto}
.cat-pop button{min-height:38px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:9px;font-size:14px;color:var(--ink);text-align:right}
.cat-pop button:hover{background:var(--surface-2)}.cat-pop button.on{background:var(--surface-2);font-weight:700}
.cat-pop button.new{color:var(--amber)}.cat-pop button.new b{color:var(--ink)}
.rowlink{cursor:pointer;transition:background .15s}.rowlink:hover{background:var(--surface-2)}
.exp-form{display:grid;grid-template-columns:150px 1fr 130px 1.4fr auto;gap:10px;align-items:end;margin-bottom:16px}
.sheet-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;border:1px solid color-mix(in srgb,var(--red) 55%,transparent);color:var(--red);font:700 13px var(--f-ui);background:color-mix(in srgb,var(--red) 8%,transparent);margin-inline-start:auto;order:99;transition:background .2s,color .2s}
.sheet-btn:hover,.sheet-btn.on{background:var(--red);color:#fff}

// an order counts as Luxury when any of its pieces is a Luxury product

/* ---------- auth ---------- */
async function boot() {
  const {data:{session}} = await sb.auth.getSession();
  if (!session) return showLogin();
  if (RECOVERY) return showReset();
  const {data: ok, error} = await sb.rpc('shop_is_admin');
  if (error || !ok) { await sb.auth.signOut(); toast('الحساب ده مش أدمن', 'err'); return showLogin(); }
  $('#loginView').classList.add('hidden'); $('#appView').classList.remove('hidden');
  await loadAll(); renderTabs();
  const [h0, code] = decodeURIComponent(location.hash.slice(1)).split('/');
  if (code) { const o = orders.find(x => x.code === code); orderQuery = code; orderFilter = 'all'; if (o) openOrders.add(o.id); go(o && isLuxOrder(o) ? 'lux-orders' : 'orders'); }
  else go(h0 || 'dash');
  try { const y = +sessionStorage.getItem('dq-admin-y'); sessionStorage.removeItem('dq-admin-y'); if (y) setTimeout(() => scrollTo(0, y), 60); } catch (e) {}
  listen(); askNotify();
  // orders that came in while the panel was closed reach the sheet when it opens (merged, older rows stay; at most every 20 min)
  try { if (Date.now() - (+localStorage.getItem('dq-sheet-merge') || 0) > 12e5) { localStorage.setItem('dq-sheet-merge', Date.now()); sheetSend({ action: 'merge', orders: orders.map(orderRow), expenses: expenses.map(expRow) }); } } catch (e) {}
}
function authPanel(id) { ['#loginForm','#forgotForm','#resetForm'].forEach(f => $(f).classList.toggle('hidden', f !== id)); }
function showLogin() { $('#appView').classList.add('hidden'); $('#loginView').classList.remove('hidden'); authPanel('#loginForm'); setTimeout(() => $('#em').focus(), 50); }
function showReset() { $('#appView').classList.add('hidden'); $('#loginView').classList.remove('hidden'); authPanel('#resetForm'); setTimeout(() => $('#npw').focus(), 50); }
$('#forgotLink').onclick = () => { $('#fem').value = $('#em').value; $('#forgotDone').classList.add('hidden'); authPanel('#forgotForm'); setTimeout(() => $('#fem').focus(), 50); };
$('#backToLogin').onclick = () => authPanel('#loginForm');
$('#forgotForm').onsubmit = async e => {
  e.preventDefault(); const b = $('#forgotBtn'); b.disabled = true; b.textContent = 'جاري الإرسال...';
  const {error} = await sb.auth.resetPasswordForEmail($('#fem').value.trim().toLowerCase(), {redirectTo: location.origin + location.pathname});
  b.disabled = false; b.textContent = 'ابعت لينك الاسترجاع';
  if (error && /rate|seconds/i.test(error.message)) return toast('استنى دقيقة قبل ما تطلب لينك تاني', 'err');
  if (error) return toast('حصلت مشكلة في الإرسال، جرب تاني', 'err');
  $('#forgotDone').classList.remove('hidden');
};
$('#resetForm').onsubmit = async e => {
  e.preventDefault();
  const a = $('#npw').value, c = $('#npw2').value;
  if (a.length < 8) return toast('الباسورد لازم 8 حروف على الأقل', 'err');
  if (a !== c) return toast('الباسوردين مش زي بعض', 'err');
  const b = $('#resetBtn'); b.disabled = true; b.textContent = 'جاري الحفظ...';
  const {error} = await sb.auth.updateUser({password: a});
  b.disabled = false; b.textContent = 'حفظ الباسورد والدخول';
  if (error) return toast(/expired|invalid|session/i.test(error.message) ? 'اللينك انتهى، اطلب لينك جديد' : 'ماتحفظش: ' + error.message, 'err');
  RECOVERY = false; history.replaceState(null, '', location.pathname);
  toast('اتغير الباسورد ✓', 'ok'); boot();
};
$('#loginForm').onsubmit = async e => {
  e.preventDefault(); const b = $('#loginBtn'); b.disabled = true; b.textContent = 'جاري الدخول...';
  const {error} = await sb.auth.signInWithPassword({email: $('#em').value.trim().toLowerCase(), password: $('#pw').value});
  b.disabled = false; b.textContent = 'دخول';
  if (error) return toast('الإيميل أو الباسورد غلط', 'err');
  boot();
};
$('#gLogin').onclick = async () => {
  const ok = await fetch(RC.url + '/auth/v1/settings', { headers: { apikey: RC.key } }).then(r => r.json()).then(j => j.external && j.external.google).catch(() => true);
  if (!ok) return toast('الدخول بجوجل لسه مش متفعل في Supabase', 'err');
  const {error} = await sb.auth.signInWithOAuth({provider: 'google', options: {redirectTo: location.origin + location.pathname}});
  if (error) toast('الدخول بجوجل مش متفعل لسه', 'err');
};

// change password: a popup from the sidebar
$('#pwBtn').onclick = () => {

    <div class="field"><label>تأكيد الباسورد</label><input class="input en" type="password" name="pw2" minlength="8" required autocomplete="new-password" dir="ltr"></div>

  document.body.appendChild(m); setTimeout(() => m.querySelector('[name=pw]').focus(), 60);

    if (f.pw !== f.pw2) return toast('الباسوردين مش زي بعض', 'err');
    const btn = e.target.querySelector('[type=submit]'); btn.disabled = true;
    const {error} = await sb.auth.updateUser({password: f.pw}); btn.disabled = false; if (error) return toast(error.message, 'err'); m.remove(); toast('اتغير الباسورد ✓', 'ok'); };
};
$('#logoutBtn').onclick = async () => { $('#appView').classList.add('hidden'); await sb.auth.signOut(); if (channel) sb.removeChannel(channel); showLogin(); };

/* ---------- data ---------- */
async function detectCols() { await Promise.all(Object.keys(COLS).map(async c => { const { error } = await sb.from('shop_products').select(c).limit(1); COLS[c] = !error; })); }
async function loadAll() { await Promise.all([loadProducts(), loadOrders(), loadSettings(), detectCols(), loadFin()]); }
async function loadProducts() { const {data, error} = await sb.from('shop_products').select('*').order('sort').order('id'); if (error) return toast(error.message, 'err'); products = data; }
async function loadOrders() { const {data, error} = await sb.from('shop_orders').select('*, shop_order_items(*)').order('created_at', {ascending:false}).limit(1000); if (error) return toast(error.message, 'err'); orders = data; }
async function loadSettings() { const {data} = await sb.from('shop_settings').select('*').eq('id',1).maybeSingle(); settings = data || {}; }
function listen() {
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('rc-orders').on('postgres_changes', {event:'INSERT', schema:'public', table:'shop_orders'}, async payload => {
    freshIds.add(payload.new.id); beep(); toast(`طلب جديد ${payload.new.code}`, 'ok'); desktopNotify(payload.new);
    await Promise.all([loadOrders(), loadProducts()]); renderTabs(); go(tab, true);
    const no = orders.find(x => x.id === payload.new.id); if (no) { sheetOrder(no); const pc = pastCancels(no); if (pc.length) setTimeout(() => toast(`⚠ رقم ${no.customer_name} عليه ${pc.length === 1 ? 'طلب' : pc.length + ' طلبات'} اتلغى قبل كدا (آخرها ${RC.when(cxAt(pc[0]))})`, 'err'), 1600); }
  }).on('postgres_changes', {event:'UPDATE', schema:'public', table:'shop_orders'}, payload => {
    // a customer cancelled their order from the store
    const o = orders.find(x => x.id === payload.new.id); if (!o || o.status === payload.new.status) return;
    Object.assign(o, payload.new);
    if (o.status === 'cancelled') { beep(); toast(`${o.cancelled_by === 'customer' ? 'العميل ' + o.customer_name + ' لغى' : 'اتلغى'} الطلب ${o.code}`, 'err'); loadProducts(); sheetOrder(o); }
    renderTabs(); refreshOrderUI(o);
  }).subscribe();
}
// desktop notification (when the dashboard is open, even in another tab)
function askNotify() { if ('Notification' in window && Notification.permission === 'default') { const b = document.createElement('button'); b.className = 'btn btn-amber btn-sm notify-ask'; b.textContent = 'فعّل إشعارات الطلبات على الجهاز ده'; b.onclick = () => Notification.requestPermission().then(() => b.remove()); document.body.appendChild(b); } }
function desktopNotify(o) {

async function uploadFiles(files) {
  files = files.filter(f => f.type.startsWith('image/')); if (!files.length) return;
  syncDraft(); const up = $('#upBtn'); up.disabled = true; up.lastChild.textContent = 'جاري الرفع...';
  let n = 0;
  for (const [k, f0] of files.entries()) {
    const f = await cropBox(f0, k, files.length); if (!f) continue;
    try {
      const blob = await compress(f);

      const {error} = await sb.storage.from(RC.bucket).upload(path, blob, {contentType: 'image/webp', cacheControl: '31536000'});
      if (error) throw error;
      draft.images.push(sb.storage.from(RC.bucket).getPublicUrl(path).data.publicUrl); n++;
    } catch (err) { toast('فشل رفع ' + f0.name + ': ' + (err.message || err), 'err'); }
  }

}
async function saveProduct() {
  syncDraft(); const d = draft;

  const price = +d.price; if (!(price >= 0) || d.price === '') return toast('اكتب سعر صحيح', 'err');
  let sale = d.sale_price == null ? null : +d.sale_price;
  if (sale != null && (isNaN(sale) || sale >= price || sale < 0)) sale = null;
  const row = { name: d.name, brand: d.brand, category: d.category, description: d.description, price, sale_price: sale, images: d.images,
    stock: String(d.stock ?? '').trim() === '' ? null : Math.max(0, parseInt(d.stock, 10) || 0), featured: d.featured, active: d.active, sort: parseInt(d.sort) || 0, updated_at: new Date().toISOString() };

async function deleteProduct() {
  if (!(await confirmBox(`تحذف "${draft.name}" نهائياً؟ لو عاوز تخفيه بس اقفل "ظاهر في المتجر".`, 'حذف'))) return;

  if (paths.length) sb.storage.from(RC.bucket).remove(paths);
  await loadProducts(); closeEditor(); renderProducts(); toast('اتحذف');
}

/* Google Sheet mirror (Apps Script web app) — fire-and-forget, the database stays the source of truth */

  sale: f.sale != null ? +f.sale : '', cost: f.cost != null ? +f.cost : '', ship_cost: f.ship_cost != null ? +f.ship_cost : '', ship_payer: f.ship_payer ? (f.ship_payer === 'me' ? 'عليا' : 'على المشتري') : '', return_loss: +f.return_loss || 0, net: orderNet(o), location: o.location || '' }; };

function renderAccounts() {
  const since = range ? Date.now() - range * 864e5 : 0;
  const inScope = o => accScope === 'all' || isLuxOrder(o) === (accScope === 'lux');
  const ORD = orders.filter(o => inScope(o) && new Date(o.created_at).getTime() >= since);
  const sold = ORD.filter(o => COUNTED.includes(o.status)), withFin = sold.filter(o => fins[o.id]), missing = sold.filter(o => !fins[o.id]);
  const rets = ORD.filter(o => o.status === 'returned');
  const sum = (l, fn) => l.reduce((s, o) => s + fn(o), 0);
  const sales = sum(withFin, o => +fins[o.id].sale), cogs = sum(withFin, o => +fins[o.id].cost);
  const shipMe = sum(withFin, o => fins[o.id].ship_payer === 'me' ? +fins[o.id].ship_cost : 0);
  const retLoss = sum(rets, o => fins[o.id] ? +fins[o.id].return_loss : 0);
  const expIn = accScope === 'all' ? expenses.filter(x => new Date(x.spent_on).getTime() >= since - 864e5) : [];
  const expSum = expIn.reduce((s, x) => s + +x.amount, 0);
  const net = sales - cogs - shipMe - retLoss - expSum, margin = sales ? net / sales * 100 : 0;
  const head = `<div class="head"><div><h1>الحسابات</h1><div class="sub">كل جنيه داخل وخارج — والنتيجة صافي ربح حقيقي</div></div>

      <div class="seg" id="accRangeSeg">${[[7,'7 أيام'],[30,'30 يوم'],[90,'90 يوم'],[0,'الكل']].map(([v,l]) => `<button data-range="${v}" class="${v===range?'on':''}">${l}</button>`).join('')}</div>
      <button type="button" class="sheet-btn ${accTab === 'sheet' ? 'on' : ''}" id="sheetTab"><i class="${sheetOn() ? 'ok' : ''}"></i>Google Sheet</button></div>
    ${FIN_OK ? '' : '<div class="warn-box">جداول الحسابات مش متفعلة في Supabase.</div>'}
    <div class="acc-tabs" id="accTabs">${[['sum','الملخص وصافي الربح'],['orders','ربح كل أوردر'],['exp','المصاريف'],['ret','المرتجعات']].map(([k,l]) => `<button data-at="${k}" class="${k===accTab?'on':''}">${l}</button>`).join('')}</div>`;
  let body = '';
  if (accTab === 'sum') {
    const flow = [['مبيعات المنتجات', sales, ''], ['− تكلفة البضاعة', cogs, 'minus'], ['− الشحن على حسابك', shipMe, 'minus'], ['− خسارة المرتجعات', retLoss, 'minus'], ['− المصاريف', expSum, 'minus']];
    const mx = Math.max(1, sales, ...flow.map(x => x[1]));
    const byCat = [...new Set([...EXP_CATS, ...expIn.map(x => x.category)])].map(c => [c, expIn.filter(x => x.category === c).reduce((s, x) => s + +x.amount, 0)]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]);
    const cmx = byCat[0] ? byCat[0][1] : 1;
    body = `${missing.length ? `<div class="warn-box"><span><b>${missing.length} طلب</b> متأكد من غير تكاليف، فصافي الربح لسه ناقص.</span><button class="btn btn-sm btn-amber" id="goMissing">سجّل التكاليف</button></div>` : ''}
    <div class="kpis">
      <div class="kpi net ${net < 0 ? 'neg' : ''}"><span>صافي الربح</span><b>${signMoney(net)}</b><small>بعد كل حاجة</small></div>
      <div class="kpi"><span>إجمالي المبيعات</span><b>${money(sales)}</b><small>${withFin.length} طلب متسجل</small></div>
      <div class="kpi"><span>تكلفة البضاعة</span><b class="minus">${money(cogs)}</b><small>سعر الشراء</small></div>
      <div class="kpi"><span>الشحن على حسابك</span><b class="minus">${money(shipMe)}</b><small>اللي اتخصم من الربح</small></div>
      <div class="kpi"><span>المصاريف</span><b class="minus">${money(expSum)}</b><small>${accScope === 'all' ? 'إعلانات وتصوير وغيره' : 'بتتحسب في «الكل» بس'}</small></div>
      <div class="kpi"><span>هامش الربح</span><b>${margin.toFixed(1)}%</b><small>من كل ١٠٠ جنيه</small></div>
    </div>
    <div class="row2">
      <div class="panel"><h2>صافي الربح اتحسب إزاي</h2><div class="flow">${flow.map(([l, v, c]) => `<div class="flow-row ${c}"><span>${l}</span><div class="tr"><i style="width:${v ? Math.max(2, v / mx * 100) : 0}%"></i></div><span>${money(v)}</span></div>`).join('')}
        <div class="flow-row sum"><span>= صافي الربح</span><div class="tr"><i style="width:${net > 0 ? Math.max(2, net / mx * 100) : 0}%"></i></div><span style="${net < 0 ? 'color:var(--red)' : ''}">${signMoney(net)}</span></div></div></div>
      <div class="panel"><h2>المصاريف حسب النوع</h2>${byCat.length ? byCat.map(([c, v]) => `<div class="bar-row"><div><span>${c}</span><span class="en">${money(v)}</span></div><div class="track"><i style="width:${Math.max(4, v / cmx * 100)}%"></i></div></div>`).join('') : '<div class="empty" style="padding:30px 10px">مفيش مصاريف متسجلة في الفترة دي.</div>'}</div>
    </div>`;
  } else if (accTab === 'sheet') {
    body = `<div class="sheet-page"><form class="panel set-card" id="sheetForm">
        <div class="set-h"><span class="set-ic">${ICONS.accounts || ''}</span><div><h2>Google Sheet للحسابات</h2><small class="${sheetOn() ? 'ok' : ''}">${sheetOn() ? 'متصل ✓' : 'مش متصل'}</small></div></div>
        <div class="field"><label>لينك الـ Web App (من Apps Script ← Deploy)</label><input class="input en" name="sheet_url" dir="ltr" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(adminSet.sheet_url || '')}"></div>
        <div class="field"><label>الكود السري (لازم يكون نفس اللي في كود الشيت)</label><input class="input en" name="sheet_secret" dir="ltr" value="${esc(adminSet.sheet_secret || '')}"></div>
        <div class="set-acts"><button class="btn btn-primary" type="submit">حفظ</button><button class="btn btn-ghost" type="button" id="sheetSync" title="بيبعت كل الطلبات والمصاريف تاني ويصلّح أي صف ناقص — للطوارئ بس">إرسال كل حاجة للشيت تاني</button></div>
      </form>
      <div class="panel sheet-how"><h2>الشيت بيشتغل إزاي</h2><ol><li>كل طلب جديد، وتغيير حالة، وتكاليف، ومرتجع، ومصروف بيتبعت للشيت لوحده على طول.</li><li>الشيت بينسّق نفسه وبيعمل صفحة «الملخص» بعد كل تعديل.</li><li>«إرسال كل حاجة للشيت تاني» للطوارئ بس، لو حد عدّل في الشيت بإيده وبوّظه.</li></ol></div></div>`;
  } else if (accTab === 'orders') {
    const list = (accMissing ? missing : [...sold, ...rets]).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    body = `<div class="toolbar"><div class="seg" id="missSeg"><button data-miss="0" class="${!accMissing ? 'on' : ''}">كل الطلبات <span class="en">${sold.length + rets.length}</span></button><button data-miss="1" class="${accMissing ? 'on' : ''}">من غير تكاليف <span class="en">${missing.length}</span></button></div></div>
    <div class="panel scroll-x" style="padding:6px 14px">${list.length ? `<table class="atable"><thead><tr><th>الطلب</th><th>العميل</th><th>الحالة</th><th>البيع</th><th>تكلفة المنتجات</th><th>الشحن</th><th>صافي الربح</th><th></th></tr></thead><tbody>
      ${list.map(o => { const f = fins[o.id], n = orderNet(o); return `<tr class="rowlink" data-fin="${o.id}" title="اضغط للتعديل"><td class="n"><b>${esc(o.code)}</b><div style="color:var(--muted-2);font-size:11px">${fmtDate(o.created_at)}</div></td><td>${esc(o.customer_name)}</td><td><span class="badge st-${o.status}">${statuses[o.status]}</span></td>
        <td class="n">${f ? money(f.sale) : '—'}</td><td class="n">${f ? money(f.cost) : '—'}</td><td class="n">${f ? `${money(f.ship_cost)} <small style="color:var(--muted)">${f.ship_payer === 'me' ? '· عليك' : '· على المشتري'}</small>` : '—'}</td>
        <td class="n">${o.status === 'returned' ? `<span class="neg">${signMoney(n)}</span>` : f ? `<span class="${n < 0 ? 'neg' : 'pos'}">${signMoney(n)}</span>` : '<span class="miss">مش متسجل</span>'}</td>
        <td><button class="btn btn-sm ${f ? 'btn-ghost' : 'btn-amber'}" data-fin="${o.id}">${f ? 'تعديل' : 'سجّل التكاليف'}</button></td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">مفيش طلبات متأكدة في الفترة دي.</div>'}</div>`;
  } else if (accTab === 'exp') {
    const today = new Date().toISOString().slice(0, 10);
    body = `<form class="panel exp-form" id="expForm"><div class="field"><label>التاريخ</label><input class="input en" type="date" name="spent_on" value="${today}" required></div>
      <div class="field"><label>البند</label><div class="cat" id="expCat"><input class="input" name="category" required autocomplete="off" placeholder="اكتب أو اختار" value="">
        <button type="button" class="cat-tg" aria-label="عرض البنود"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button><div class="cat-pop" role="listbox"></div></div></div>
      <div class="field"><label>المبلغ</label><input class="input en" name="amount" inputmode="decimal" required placeholder="0"></div>
      <div class="field"><label>ملاحظة</label><input class="input" name="note" placeholder="اختياري"></div>
      <button class="btn btn-amber" type="submit">+ إضافة</button></form>
    <div class="panel scroll-x" style="padding:6px 14px">${expIn.length || accScope !== 'all' ? (accScope !== 'all' ? '<div class="empty">المصاريف بتظهر في «الكل».</div>' : `<table class="atable" style="min-width:560px"><thead><tr><th>التاريخ</th><th>البند</th><th>المبلغ</th><th>ملاحظة</th><th></th></tr></thead><tbody>${expIn.map(x => `<tr><td class="n"><span class="en" dir="ltr">${dmy(x.spent_on + 'T00:00')}</span></td><td>${esc(x.category)}</td><td class="n neg">${money(x.amount)}</td><td style="color:var(--muted)">${esc(x.note || '')}</td><td><button class="btn btn-sm btn-ghost" data-xdel="${x.id}">حذف</button></td></tr>`).join('')}</tbody></table>`) : '<div class="empty">مفيش مصاريف في الفترة دي.</div>'}</div>`;
  } else {
    body = `<div class="panel scroll-x" style="padding:6px 14px">${rets.length ? `<table class="atable"><thead><tr><th>الطلب</th><th>العميل</th><th>المنتجات (رجعت للمخزون)</th><th>قيمة الطلب</th><th>خسارة المرتجع</th><th></th></tr></thead><tbody>
      ${rets.map(o => { const f = fins[o.id]; return `<tr class="rowlink" data-fin="${o.id}" title="اضغط للتعديل"><td class="n"><b>${esc(o.code)}</b><div style="color:var(--muted-2);font-size:11px">${fmtDate(o.created_at)}</div></td><td>${esc(o.customer_name)}</td><td style="font-size:12.5px">${(o.shop_order_items || []).map(i => `${esc(i.name)} × ${i.qty}`).join('<br>')}</td><td class="n">${money(o.subtotal)}</td><td class="n neg">${f ? money(f.return_loss) : '—'}</td><td><button class="btn btn-sm btn-ghost" data-fin="${o.id}">${f ? 'تعديل' : 'سجّل'}</button></td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">مفيش مرتجعات في الفترة دي.</div>'}</div>`;
  }
  $('#main').innerHTML = head + body;
  $('#sheetTab').onclick = () => { accTab = accTab === 'sheet' ? 'sum' : 'sheet'; renderAccounts(); };
  if ($('#sheetForm')) {
  $('#sheetForm').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    const row = { id: 1, sheet_url: f.sheet_url.trim() || null, sheet_secret: f.sheet_secret.trim() || null };
    if (row.sheet_url && !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(row.sheet_url)) return toast('اللينك لازم يبقى بالشكل ده: https://script.google.com/macros/s/…/exec', 'err');
    const {error} = await sb.from('shop_admin_settings').upsert(row); if (error) return toast(error.message, 'err');
    Object.assign(adminSet, row); toast('اتحفظ ✓', 'ok'); renderAccounts(); if (sheetOn()) sheetSyncAll(); };
  $('#sheetSync').onclick = sheetSyncAll;
  }
  $('#accTabs').onclick = e => { const b = e.target.closest('[data-at]'); if (b) { accTab = b.dataset.at; renderAccounts(); } };
  $('#accScopeSeg').onclick = e => { const b = e.target.closest('[data-as]'); if (b) { accScope = b.dataset.as; renderAccounts(); } };
  $('#accRangeSeg').onclick = e => { const b = e.target.closest('[data-range]'); if (b) { range = +b.dataset.range; renderAccounts(); } };
  if ($('#goMissing')) $('#goMissing').onclick = () => { accTab = 'orders'; accMissing = true; renderAccounts(); };
  if ($('#missSeg')) $('#missSeg').onclick = e => { const b = e.target.closest('[data-miss]'); if (b) { accMissing = b.dataset.miss === '1'; renderAccounts(); } };
  if ($('#expCat')) {
    // category: type anything, or pick from the usual list plus the ones used before
    const box = $('#expCat'), inp = box.querySelector('input'), pop = box.querySelector('.cat-pop');
    const all = [...new Set([...EXP_CATS, ...expenses.map(x => x.category).filter(Boolean)])];
    const fill = () => { const q = inp.value.trim(), list = all.filter(c => !q || c.includes(q));
      pop.innerHTML = list.map(c => `<button type="button" data-cat="${esc(c)}" class="${c === q ? 'on' : ''}">${esc(c)}</button>`).join('') + (q && !all.includes(q) ? `<button type="button" data-cat="${esc(q)}" class="new">+ بند جديد: <b>${esc(q)}</b></button>` : ''); };
    const open = v => { if (v) fill(); box.classList.toggle('open', v); };
    inp.onfocus = () => open(true); inp.oninput = () => open(true);
    box.querySelector('.cat-tg').onclick = () => { open(!box.classList.contains('open')); inp.focus(); };
    pop.onmousedown = e => e.preventDefault();
    pop.onclick = e => { const b = e.target.closest('[data-cat]'); if (b) { inp.value = b.dataset.cat; open(false); $('#expForm [name=amount]').focus(); } };
    inp.onblur = () => setTimeout(() => open(false), 120);
    inp.onkeydown = e => { if (e.key === 'Escape') open(false); };
  }
  if ($('#expForm')) $('#expForm').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const amount = +String(f.amount).replace(/[^\d.]/g, '');
    if (!amount) return toast('اكتب المبلغ', 'err');
    const { data, error } = await sb.from('shop_expenses').insert({ spent_on: f.spent_on, category: f.category, amount, note: f.note.trim() || null }).select().single(); if (error) return toast(error.message, 'err');
    expenses.unshift(data); sheetSend({ action: 'upsert', sheet: 'expenses', row: expRow(data) }); toast('اتضاف المصروف ✓', 'ok'); renderAccounts(); };
  $('#main').querySelectorAll('[data-xdel]').forEach(b => b.onclick = async () => { const id = +b.dataset.xdel; if (!(await confirmBox('تحذف المصروف ده؟', 'حذف'))) return;
    const { error } = await sb.from('shop_expenses').delete().eq('id', id); if (error) return toast(error.message, 'err');
    expenses = expenses.filter(x => x.id !== id); sheetSend({ action: 'delete', sheet: 'expenses', id }); toast('اتحذف'); renderAccounts(); });
}

/* ---------- auto-update: a new release reloads the panel by itself (same tab, same scroll) ---------- */
let dirty = false;
document.addEventListener('input', e => { if (e.target.closest('#main, .fin-m')) dirty = true; }, true);
const _go = go; go = (t, k) => { dirty = false; _go(t, k); };
const adminBusy = () => dirty || !!document.querySelector('.fin-m, .confirm, .crop') || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
async function checkBuild() {
  if (!RC.build || $('#appView').classList.contains('hidden')) return;
  try {
    const v = (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json())).v;
    if (!v || v === RC.build) return;
    const reload = () => { if (adminBusy()) return setTimeout(reload, 4000); try { sessionStorage.setItem('dq-admin-y', scrollY); } catch (e) {} location.reload(); };
    reload();
  } catch (e) {}
}
setInterval(() => { if (!document.hidden) checkBuild(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkBuild(); });
addEventListener('focus', checkBuild);

boot();
</script>
<style>
.pw-wrap{position:relative;display:block}
.pw-wrap input{width:100%;padding-inline-end:46px !important;box-sizing:border-box}
.pw-eye{position:absolute;top:50%;inset-inline-end:6px;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;border:0;background:transparent;color:inherit;opacity:.6;cursor:pointer;border-radius:8px}
.pw-eye:hover,.pw-eye:focus-visible{opacity:1}
.pw-eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pw-eye .off{display:none}.pw-eye.on .on{display:none}.pw-eye.on .off{display:block}
</style>
<script>
// show / hide password on every password field (including ones added later)
(function(){
  var ICON='<svg class="on" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.5 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  function add(inp){
    if(inp.dataset.eye) return; inp.dataset.eye='1';
    var w=document.createElement('span'); w.className='pw-wrap';
    w.dir=getComputedStyle(inp).direction; // eye sits on the same side as the input's own text end
    inp.parentNode.insertBefore(w,inp); w.appendChild(inp);
    var b=document.createElement('button'); b.type='button'; b.className='pw-eye'; b.innerHTML=ICON;
    b.setAttribute('aria-label','Show password'); b.title='Show password';
    b.addEventListener('click',function(){
      var show=inp.type==='password'; inp.type=show?'text':'password';
      b.classList.toggle('on',show); b.setAttribute('aria-label',show?'Hide password':'Show password'); b.title=b.getAttribute('aria-label');
      inp.focus({preventScroll:true});
    });
    w.appendChild(b);
  }
  function scan(){ document.querySelectorAll('input[type=password]:not([data-eye])').forEach(add); }
  scan(); new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body>
