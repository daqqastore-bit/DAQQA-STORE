<style>
body{font-size:14px}
.hidden{display:none!important}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 30%,var(--glow),transparent 60%)}
.login form{width:min(380px,100%);background:var(--bg-2);border:1px solid var(--line);border-radius:22px;padding:30px;display:flex;flex-direction:column;gap:14px}

/* shell */
.app{display:flex;min-height:100vh}
.side{width:240px;flex:none;background:var(--bg-2);border-left:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:calc(100vh / var(--z));overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.side .brand{display:flex;align-items:center;gap:10px;padding:0 8px}
/* theme switch sits next to the brand so it is always in view */
.th-sw{margin-inline-start:auto;position:relative;width:58px;height:30px;flex:none;border-radius:99px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 7px;direction:ltr;color:var(--muted);cursor:pointer;transition:border-color .3s}

.th-sw::before{content:"";position:absolute;top:3px;width:22px;height:22px;border-radius:50%;background:var(--amber);left:3px;transition:left .35s cubic-bezier(.3,.7,.2,1)}
:root[data-theme="light"] .th-sw::before{left:31px}
.th-sw .mo{color:var(--amber-ink)}:root[data-theme="light"] .th-sw .mo{color:var(--muted)}:root[data-theme="light"] .th-sw .su{color:var(--amber-ink)}
.side .brand .m{width:36px;height:37px}

.tabs{display:flex;flex-direction:column;gap:4px}

.tab svg{width:18px;height:18px;flex:none}

.tab .pill{margin-inline-start:auto;background:var(--amber);color:var(--amber-ink);font:700 11px/20px var(--f-ui);min-width:22px;text-align:center;border-radius:999px;padding:0 6px}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side .foot a,.side .foot button{height:40px;border-radius:10px;display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted);font-size:13px}
.side .foot a:hover,.side .foot button:hover{color:var(--ink);background:var(--surface)}
.side .foot svg{width:17px;height:17px}
main{flex:1;min-width:0;padding:28px 32px 60px}
.head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}

.sd{background:transparent;color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}.sd:hover{border-color:var(--c)}

.search svg{width:16px;height:16px;flex:none}
.orders{display:flex;flex-direction:column;gap:10px}
.order{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:border-color .2s}

.o-top{display:grid;grid-template-columns:150px 1fr 120px 130px 150px 24px;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}

.warn-chip{display:inline-block;margin-inline-start:8px;font:600 11px var(--f-ui);font-style:normal;color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);padding:2px 8px;border-radius:99px;vertical-align:middle}
.cx-box{border-radius:12px;padding:10px 12px;background:var(--surface-2);display:grid;gap:3px;font-size:12.5px;color:var(--muted)}

.o-top .who span{font:12px var(--f-ui);color:var(--muted);direction:ltr;display:inline-block}

.o-items{flex:2 1 320px;display:flex;flex-direction:column;gap:10px}

.st-card{display:grid;gap:14px;margin-bottom:16px}.st-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.st-h h2{margin:0;font-size:18px}.st-h small{color:var(--muted);font-size:12px;letter-spacing:.1em}

.stk{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;font:600 12.5px var(--f-ui);border:1px solid;white-space:nowrap;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}

:root:not([data-theme="light"]) .stk.in{color:#5fd08f}:root:not([data-theme="light"]) .stk.out{color:#f07a6e}:root:not([data-theme="light"]) .stk.low{color:#f0b65a}
@media (max-width:600px){table.ptable{min-width:0}.ptable td:nth-child(2){white-space:nowrap;font-size:13px}.ptable th:nth-child(3),.ptable td:nth-child(3){display:none}.stk{padding:5px 9px;font-size:11px;gap:5px}.stk b{display:none}.ptable .pcell img{width:40px;height:40px}}
.o-line{color:var(--ink);font-weight:600}
@media (max-width:600px){.o-item .q{align-items:flex-start}}

.ov-k{position:relative;display:grid;gap:4px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;color:var(--ink);transition:border-color .2s,transform .2s}
.ov-k:hover{border-color:var(--line-2);transform:translateY(-2px)}
.ov-k i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--surface-2);color:var(--amber);margin-bottom:6px}
.ov-k i svg{width:18px;height:18px}
.ov-k span{font-size:13px;color:var(--muted)}
.ov-k b{font:700 26px/1.25 var(--f-ui);direction:ltr;text-align:right}
.ov-k small{font-size:12px;color:var(--muted-2)}.ov-k small em{font-style:normal;color:var(--amber);font-weight:600}
.ov-k.net{border-color:color-mix(in srgb,var(--green) 55%,transparent);background:color-mix(in srgb,var(--green) 10%,var(--surface))}
.ov-k.net b{color:var(--green)}.ov-k.net i{color:var(--green)}
.ov-k.net.neg{border-color:color-mix(in srgb,var(--red) 55%,transparent);background:color-mix(in srgb,var(--red) 9%,var(--surface))}.ov-k.net.neg b,.ov-k.net.neg i{color:var(--red)}
.ov-k.warn i,.ov-k.warn b{color:var(--red)}
.ov-more{font-size:12.5px;color:var(--amber);font-weight:600}
.ov-ord{display:grid}
.ov-o{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 6px;border-bottom:1px solid var(--line);text-align:start;color:var(--ink);border-radius:10px}
.ov-o:last-child{border-bottom:0}.ov-o:hover{background:var(--surface-2)}
.ov-o1{display:grid;gap:2px;min-width:0}.ov-o1 b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ov-o1 small{font-size:12px;color:var(--muted)}
.ov-o2{display:flex;align-items:center;gap:10px;flex-shrink:0}.ov-o2 b{font:700 14px var(--f-ui)}
.ov-grid{display:grid;gap:10px}
.ov-gh{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);font-weight:600;margin-top:4px}
.ov-gh b{font:700 15px var(--f-ui);color:var(--ink)}.ov-gh.lx span{color:var(--amber);letter-spacing:.06em}
.ov-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));grid-auto-flow:column;gap:8px}
.ov-c{display:grid;gap:2px;justify-items:center;padding:12px 6px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);color:var(--ink)}
.ov-c:hover{border-color:var(--amber)}.ov-c b{font:700 22px/1.1 var(--f-ui)}.ov-c span{font-size:12px;color:var(--muted)}
.ov-offs{display:grid;gap:6px}.ov-offs > small,.ov-none{font-size:12px;color:var(--muted)}
.ov-off{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;text-align:start;color:var(--ink)}.ov-off:hover{background:var(--surface-2)}
.ov-off img,.ov-l img,.ov-s img{width:36px;height:36px;border-radius:9px;object-fit:cover;background:var(--surface-2);flex-shrink:0}
.ov-off span{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-off b{font:700 12px var(--f-ui);color:var(--red);background:color-mix(in srgb,var(--red) 12%,transparent);padding:3px 8px;border-radius:999px}
.ov-tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;align-items:center}.ov-tools .input{flex:1 1 180px;height:38px;min-width:0}
.ov-stk{display:grid;max-height:560px;overflow:auto;margin:0 -6px;padding:0 6px}
.ov-s{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.ov-s:last-child{border-bottom:0}.ov-s.off{opacity:.55}
.ov-sn{flex:1;min-width:0;display:grid;gap:1px}.ov-sn b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ov-sn small{font-size:11.5px;color:var(--muted)}
.ov-step{display:flex;align-items:center;border:1px solid var(--line-2);border-radius:999px;overflow:hidden;flex-shrink:0;direction:ltr;transition:border-color .2s}
.ov-step button{width:34px;height:34px;font-size:18px;color:var(--ink);display:grid;place-items:center}.ov-step button:hover{background:var(--surface-2)}
.ov-step input{width:48px;height:34px;border:0;background:none;text-align:center;font:600 14px var(--f-ui);color:var(--ink);outline:0;padding:0}
.ov-s.saving .ov-step{border-color:var(--amber)}.ov-s.saved .ov-step{border-color:var(--green)}
.ov-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--green)}.ov-dot.low{background:var(--amber)}.ov-dot.out{background:var(--red)}
.ov-low{display:grid;gap:4px}
.ov-l{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:10px;text-align:start;color:var(--ink)}.ov-l:hover{background:var(--surface-2)}
.ov-l span{flex:1;min-width:0;display:grid;font-size:13px}.ov-l span small{font-size:11.5px;color:var(--muted)}
.ov-l b{font-size:12px;color:var(--amber);white-space:nowrap}.ov-l b.out{color:var(--red)}

@media (max-width:600px){.ov-kpis{grid-template-columns:1fr 1fr;gap:10px}.ov-k.net{grid-column:span 2}.ov-k{padding:13px}.ov-k b{font-size:21px}.ov-k i{width:30px;height:30px;margin-bottom:2px}
  .ov-o{flex-wrap:wrap;gap:6px}.ov-o2{width:100%;justify-content:space-between}.ov-stk{max-height:none}}

.pt-card{display:grid;gap:10px}.pt-h{display:flex;align-items:center;gap:10px}.pt-h b{font-size:17px;flex:1}.pt-h small{color:var(--muted);font:600 12px var(--f-ui)}

.pt-share{display:grid;gap:2px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--green) 10%,var(--surface-2))}.pt-share span{font-size:12.5px;color:var(--muted)}
.pt-share b{font:700 24px/1.2 var(--f-ui);color:var(--green);direction:ltr;text-align:right}.pt-share.neg{background:color-mix(in srgb,var(--red) 10%,var(--surface-2))}.pt-share.neg b{color:var(--red)}
.pt-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.pt-row b{color:var(--ink);font-family:var(--f-ui)}
@media (max-width:760px){.pt-grid{grid-template-columns:1fr;gap:10px}}
.ovp .ovp-list{display:grid;gap:4px;max-height:52dvh;overflow:auto}
.ovp-split{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.ovp-split div{display:grid;gap:2px;padding:10px;border-radius:12px;background:var(--surface);text-align:center}.ovp-split small{color:var(--muted);font-size:12px}.ovp-split b{font:700 15px var(--f-ui);color:var(--green)}
.ovp-st{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ovp-st .sd{justify-content:space-between;background:var(--surface);width:100%}.ovp-st .sd b{margin-inline-start:auto;font-family:var(--f-ui)}
.ovp-t{width:100%;border-collapse:collapse;font-size:13.5px;text-align:center}.ovp-t th,.ovp-t td{padding:10px 6px;border-bottom:1px solid var(--line)}.ovp-t td:first-child{text-align:start;font-weight:600}.ovp-t thead th{color:var(--muted);font-weight:500;font-size:12px}.ovp-t td.en{font:700 16px var(--f-ui)}
.cp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cp-card{display:grid;gap:12px}.cp-card.off{opacity:.6}
.cp-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cp-top code{font:700 20px var(--f-ui);letter-spacing:.1em;padding:6px 12px;border:1.5px dashed var(--amber);border-radius:10px;color:var(--amber)}
.cp-top b{font:800 28px var(--f-ui);color:var(--green)}
.cp-tags{display:flex;flex-wrap:wrap;gap:6px}.cp-tags span{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted)}.cp-tags b{color:var(--ink)}
.cp-acts{display:flex;align-items:center;gap:8px}.cp-acts small{font-size:12px;color:var(--muted)}
.cp-seg{width:100%}.cp-seg button{flex:1}
.cp-tag{font:700 11.5px var(--f-ui);letter-spacing:.06em;padding:1px 6px;border:1px dashed var(--amber);border-radius:6px;color:var(--amber)}
.o-unit{display:inline-flex;align-items:baseline;gap:8px;font-family:var(--f-ui)}.o-unit small{font:500 12.5px var(--f-ar);color:var(--muted)}.o-unit b{font-size:16px;color:var(--ink)}.o-unit s{font-size:13px;color:var(--muted-2);text-decoration-color:var(--red)}
.o-unit.tot{padding-top:6px;border-top:1px dashed var(--line-2)}.o-unit.tot b{font-size:17px;color:var(--green)}
.rep-chip{font-style:normal;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue);width:max-content}
.ch-box{border-radius:12px;padding:12px;background:var(--surface-2);display:grid;gap:9px;font-size:12.5px}
.ch-box.new{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted)}.ch-box.new b{color:var(--green);font-size:13px}
.ch-h{display:flex;justify-content:space-between;align-items:center}.ch-h b{font-size:13.5px}.ch-all{font-size:12px;color:var(--amber);font-weight:600}
.ch-n{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ch-n>span{display:grid;justify-items:center;gap:1px;padding:7px 4px;border-radius:10px;background:var(--surface);color:var(--muted);font-size:11.5px}
.ch-n b{font:700 17px var(--f-ui);color:var(--ink)}.ch-n .ok b{color:var(--green)}.ch-n .bad b{color:var(--red)}.ch-n small{font-size:10.5px}
.ch-l{display:grid;gap:4px;max-height:150px;overflow:auto}.ch-l>span{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.ch-l>span.me{color:var(--ink);font-weight:600}
.ch-l i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}.ch-l em{font-style:normal;margin-inline-start:auto;color:var(--c)}.ch-l>span:has(.st-cancelled) em{color:var(--red)}
.ch-sp{color:var(--muted)}.ch-sp b{color:var(--green)}
.cu-tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.cu-t td{vertical-align:middle}.cu-cx{color:var(--red);font-weight:700}.cu-cx small{font-weight:400;color:var(--muted)}.cu-acc{font-size:12px;color:var(--green);font-weight:600;white-space:nowrap}
</style>

<!-- LOGIN -->
<section class="login hidden" id="loginView">
  <form id="loginForm" autocomplete="on">

/* ---------- double-submit guard ----------

        const btn = e.submitter || this.querySelector('[type=submit]');

})();

function cropBox(file, idx, total, lock) {

    const d = document.createElement('div'); d.className = 'crop';
    const R = lock ? [lock] : [['حر', 0], ['الأصل', -1], ['1:1', 1], ['4:5', 4 / 5], ['3:4', 3 / 4], ['16:9', 16 / 9]];
    d.innerHTML = `<div class="crop-top"><div><b>قص الصورة</b><small>${total > 1 ? `${idx + 1} من ${total} · ` : ''}${lock ? `المقاس مقفول على ${lock[0]} عشان يطلع مظبوط في مكانه · ` : ''}اسحب المربع وكبّره من الأركان</small></div>
      <div class="crop-ratios">${R.map(([t], i) => `<button type="button" data-r="${i}" class="${i ? '' : 'on'}">${t}</button>`).join('')}</div></div>
      <div class="crop-area"><div class="crop-wrap"><img alt="" src="${url}"><div class="crop-box"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div></div>
      <div class="crop-acts"><button type="button" class="btn btn-primary" data-a="ok">قص وارفع</button><button type="button" class="btn btn-ghost" data-a="full">ارفعها كاملة</button>${total - idx > 1 ? `<button type="button" class="btn btn-ghost" data-a="all">ارفع الباقي كله كامل (${total - idx})</button>` : ''}<button type="button" class="btn btn-ghost" data-a="skip">${total > 1 ? 'تخطّى الصورة دي' : 'إلغاء'}</button></div>`;
    document.body.appendChild(d);
    const img = d.querySelector('img'), box = d.querySelector('.crop-box'), area = d.querySelector('.crop-area');
    await img.decode().catch(() => {});
    const fit = () => { img.style.maxWidth = Math.max(80, area.clientWidth - 36) + 'px'; img.style.maxHeight = Math.max(80, area.clientHeight - 20) + 'px'; };
    fit();
    let W = img.clientWidth, H = img.clientHeight, ratio = 0, b = { x: 0, y: 0, w: W, h: H };
    const draw = () => Object.assign(box.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' });
    const setRatio = r => { ratio = r;
      if (r <= 0) { b = { x: 0, y: 0, w: W, h: H }; if (r < 0) ratio = W / H; return draw(); }
      let w = W, h = w / r; if (h > H) { h = H; w = h * r; } b = { x: (W - w) / 2, y: (H - h) / 2, w, h }; draw(); };
    setRatio(lock ? lock[1] : 0);
    d.querySelector('.crop-ratios').onclick = e => { const t = e.target.closest('[data-r]'); if (!t) return;
      d.querySelectorAll('.crop-ratios button').forEach(x => x.classList.toggle('on', x === t)); setRatio(R[+t.dataset.r][1]); };
    addEventListener('resize', onResize); function onResize() { fit(); const k = img.clientWidth / W; W = img.clientWidth; H = img.clientHeight; b = { x: b.x * k, y: b.y * k, w: b.w * k, h: b.h * k }; draw(); }
    let drag = null;

      if (drag.h === 'move') { b.x = Math.max(0, Math.min(W - o.w, o.x + dx)); b.y = Math.max(0, Math.min(H - o.h, o.y + dy)); return draw(); }

      let w = Math.max(MIN, L ? o.w - dx : o.w + dx), h = Math.max(MIN, T ? o.h - dy : o.h + dy);

    d.querySelector('.crop-acts').onclick = async e => { const a = e.target.closest('[data-a]'); if (!a) return;
      const done = v => { removeEventListener('resize', onResize); d.remove(); URL.revokeObjectURL(url); res(v); };

      c.width = Math.round(b.w * k); c.height = Math.round(b.h * k);

  });

    const list = (accMissing ? missing : [...sold, ...rets]).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
    body = `<div class="toolbar"><div class="seg" id="missSeg"><button data-miss="0" class="${!accMissing ? 'on' : ''}">كل الطلبات <span class="en">${sold.length + rets.length}</span></button><button data-miss="1" class="${accMissing ? 'on' : ''}">من غير تكاليف <span class="en">${missing.length}</span></button></div></div>
    <div class="panel scroll-x" style="padding:6px 14px">${list.length ? `<table class="atable"><thead><tr><th>الطلب</th><th>العميل</th><th>الحالة</th><th>البيع</th><th>تكلفة المنتجات</th><th>الشحن</th><th>صافي الربح</th><th></th></tr></thead><tbody>
      ${list.map(o => { const f = fins[o.id], n = orderNet(o); return `<tr class="rowlink" data-fin="${o.id}" title="اضغط للتعديل"><td class="n"><b>${esc(o.code)}</b><div style="color:var(--muted-2);font-size:11px">${fmtDate(o.created_at)}</div></td><td>${esc(o.customer_name)}</td><td><span class="badge st-${o.status}">${statuses[o.status]}</span></td>
        <td class="n">${f ? money(f.sale) : '—'}</td><td class="n">${f ? money(f.cost) : '—'}</td><td class="n">${f ? `${money(f.ship_cost)} <small style="color:var(--muted)">${f.ship_payer === 'me' ? '· عليك' : '· على المشتري'}</small>` : '—'}</td>
        <td class="n">${o.status === 'returned' ? `<span class="neg">${signMoney(n)}</span>` : f ? `<span class="${n < 0 ? 'neg' : 'pos'}">${signMoney(n)}</span>` : '<span class="miss">مش متسجل</span>'}</td>
        <td><button class="btn btn-sm ${f ? 'btn-ghost' : 'btn-amber'}" data-fin="${o.id}">${f ? 'تعديل' : 'سجّل التكاليف'}</button></td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">مفيش طلبات متأكدة في الفترة دي.</div>'}</div>`;
  } else if (accTab === 'off') {
    body = `<div class="panel scroll-x" style="padding:6px 14px">${!OFF_OK ? '<div class="empty">جدول البيع خارج الموقع مش متفعل في Supabase.</div>' : OFF.length ? `<table class="atable" style="min-width:760px"><thead><tr><th>التاريخ</th><th>المنتج</th><th>البائع</th><th>البيع</th><th>التكلفة</th><th>الشحن</th><th>صافي الربح</th><th></th></tr></thead><tbody>
      ${OFF.map(x => { const n = offNet(x); return `<tr><td class="n"><span class="en" dir="ltr">${dmy(x.sold_on + 'T00:00')}</span></td><td><b>${esc(x.name)}</b>${+x.qty > 1 ? ` <small style="color:var(--muted)">× ${x.qty}</small>` : ''}${x.note ? `<div style="color:var(--muted-2);font-size:11.5px">${esc(x.note)}</div>` : ''}</td><td>${x.seller ? esc(x.seller) : '<span style="color:var(--muted-2)">—</span>'}</td>
        <td class="n">${money(x.price)}</td><td class="n">${money(x.cost)}</td><td class="n">${money(x.ship_cost)} <small style="color:var(--muted)">${x.ship_payer === 'me' ? '· عليك' : '· على المشتري'}</small></td>
        <td class="n"><span class="${n < 0 ? 'neg' : 'pos'}">${signMoney(n)}</span></td><td style="white-space:nowrap"><button class="btn btn-sm btn-ghost" data-offedit="${x.id}">تعديل</button> <button class="btn btn-sm btn-ghost" data-offdel="${x.id}">حذف</button></td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">مفيش بيع خارج الموقع في الفترة دي. دوس «بيع خارج الموقع» فوق عشان تسجّل بيعة.</div>'}</div>`;
  } else if (accTab === 'exp') {
    const today = new Date().toISOString().slice(0, 10);
    body = `<form class="panel exp-form" id="expForm"><div class="field"><label>التاريخ</label><input class="input en" type="date" name="spent_on" value="${today}" required></div>
      <div class="field"><label>البند</label><div class="cat" id="expCat"><input class="input" name="category" required autocomplete="off" placeholder="اكتب أو اختار" value="">
        <button type="button" class="cat-tg" aria-label="عرض البنود"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></button><div class="cat-pop" role="listbox"></div></div></div>
      <div class="field"><label>المبلغ</label><input class="input en" name="amount" inputmode="decimal" required placeholder="0"></div>
      <div class="field"><label>مين دفع</label><input class="input" name="paid_by" list="expPayers" autocomplete="off" placeholder="اختار أو اكتب">${payerList('expPayers')}</div>
      <div class="field"><label>ملاحظة</label><input class="input" name="note" placeholder="اختياري"></div>
      <button class="btn btn-amber" type="submit">+ إضافة</button></form>
    <div class="panel scroll-x" style="padding:6px 14px">${expIn.length || accScope !== 'all' ? (accScope !== 'all' ? '<div class="empty">المصاريف بتظهر في «الكل».</div>' : `<table class="atable" style="min-width:660px"><thead><tr><th>التاريخ</th><th>البند</th><th>المبلغ</th><th>مين دفع</th><th>ملاحظة</th><th></th></tr></thead><tbody>${expIn.map(x => `<tr><td class="n"><span class="en" dir="ltr">${dmy(x.spent_on + 'T00:00')}</span></td><td>${esc(x.category)}</td><td class="n neg">${money(x.amount)}</td><td>${x.paid_by ? `<span class="payer">${esc(x.paid_by)}</span>` : '<span style="color:var(--muted-2)">—</span>'}</td><td style="color:var(--muted)">${esc(x.note || '')}</td><td style="white-space:nowrap"><button class="btn btn-sm btn-ghost" data-xedit="${x.id}">تعديل</button> <button class="btn btn-sm btn-ghost" data-xdel="${x.id}">حذف</button></td></tr>`).join('')}</tbody></table>`) : '<div class="empty">مفيش مصاريف في الفترة دي.</div>'}</div>`;
  } else if (accTab === 'partners') {
    const share = net / PARTNERS.length, noRcv = sold.filter(o => !(fins[o.id] && fins[o.id].received_by)).length;
    const got = n => sold.filter(o => fins[o.id] && (fins[o.id].received_by || '').trim() === n).reduce((s, o) => s + +o.total, 0) + OFF.filter(x => (x.seller || '').trim() === n).reduce((s, x) => s + +x.price, 0);
    const paid = n => expIn.filter(x => (x.paid_by || '').trim() === n).reduce((s, x) => s + +x.amount, 0);
    body = `${accScope !== 'all' ? '<div class="warn-box">التقسيم الصح على «الكل» عشان المصاريف بتتحسب فيه بس.</div>' : ''}
    <div class="kpis"><div class="kpi net ${net < 0 ? 'neg' : ''}"><span>صافي الربح اللي هيتقسم</span><b>${signMoney(net)}</b><small>${range ? `آخر ${range} يوم` : 'من الأول'} · على ${PARTNERS.length} بالتساوي</small></div></div>
    <div class="pt-grid">${PARTNERS.map(n => `<div class="panel pt-card"><div class="pt-h"><span class="pt-av">${esc(n.slice(0, 1))}</span><b>${esc(n)}</b><small>${(100 / PARTNERS.length).toFixed(1)}%</small></div>
      <div class="pt-share ${share < 0 ? 'neg' : ''}"><span>نصيبه من صافي الربح</span><b>${signMoney(share)}</b></div>
      <div class="pt-row"><span>استلم فلوس طلبات</span><b class="en">${money(got(n))}</b></div>
      <div class="pt-row"><span>دفع مصاريف</span><b class="en">${money(paid(n))}</b></div></div>`).join('')}</div>
    ${noRcv ? `<div class="warn-box" style="margin-top:14px"><span><b>${noRcv} طلب</b> مش متسجل مين استلم فلوسه.</span><button class="btn btn-sm btn-amber" data-at="orders">افتح ربح كل أوردر</button></div>` : ''}`;
  } else {
    body = `<div class="panel scroll-x" style="padding:6px 14px">${rets.length ? `<table class="atable"><thead><tr><th>الطلب</th><th>العميل</th><th>المنتجات (رجعت للمخزون)</th><th>قيمة الطلب</th><th>خسارة المرتجع</th><th></th></tr></thead><tbody>
      ${rets.map(o => { const f = fins[o.id]; return `<tr class="rowlink" data-fin="${o.id}" title="اضغط للتعديل"><td class="n"><b>${esc(o.code)}</b><div style="color:var(--muted-2);font-size:11px">${fmtDate(o.created_at)}</div></td><td>${esc(o.customer_name)}</td><td style="font-size:12.5px">${(o.shop_order_items || []).map(i => `${esc(i.name)} × ${i.qty}`).join('<br>')}</td><td class="n">${money(o.subtotal)}</td><td class="n neg">${f ? money(f.return_loss) : '—'}</td><td><button class="btn btn-sm btn-ghost" data-fin="${o.id}">${f ? 'تعديل' : 'سجّل'}</button></td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">مفيش مرتجعات في الفترة دي.</div>'}</div>`;
  }
  $('#main').innerHTML = head + body;
  $('#main').querySelectorAll('[data-offdel]').forEach(b => b.onclick = () => once('offdel' + b.dataset.offdel, async () => { const id = +b.dataset.offdel; if (!(await confirmBox('تحذف البيعة دي من الحسابات؟', 'حذف'))) return;
    const { error } = await sb.from('shop_offline_sales').delete().eq('id', id); if (error) return toast(error.message, 'err');
    offs = offs.filter(x => x.id !== id); sheetSend({ action: 'delete', sheet: 'offline', id }); toast('اتحذفت'); renderAccounts(); }));
  $('#sheetTab').onclick = () => { accTab = accTab === 'sheet' ? 'sum' : 'sheet'; renderAccounts(); };
  if ($('#sheetForm')) {
  $('#sheetForm').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target));
    const row = { id: 1, sheet_url: f.sheet_url.trim() || null, sheet_secret: f.sheet_secret.trim() || null };
    if (row.sheet_url && !/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(row.sheet_url)) return toast('اللينك لازم يبقى بالشكل ده: https://script.google.com/macros/s/…/exec', 'err');
    const {error} = await sb.from('shop_admin_settings').upsert(row); if (error) return toast(error.message, 'err');
    Object.assign(adminSet, row); toast('اتحفظ ✓', 'ok'); renderAccounts(); if (sheetOn()) sheetSyncAll(); };
  $('#sheetSync').onclick = () => once('sheetsync', sheetSyncAll);
  }
  { const st = $('#accTabs'), on = st.querySelector('.on'); if (tabX != null) st.scrollLeft = tabX;
    if (on) { const r = on.getBoundingClientRect(), sr = st.getBoundingClientRect(); if (r.left < sr.left || r.right > sr.right) st.scrollBy({ left: r.left < sr.left ? r.left - sr.left - 16 : r.right - sr.right + 16, behavior: 'smooth' }); } }
  $('#accTabs').onclick = e => { const b = e.target.closest('[data-at]'); if (b) { accTab = b.dataset.at; renderAccounts(); } };
  $('#main').querySelectorAll('.warn-box [data-at]').forEach(b => b.onclick = () => { accTab = b.dataset.at; accMissing = false; renderAccounts(); });
  $('#accScopeSeg').onclick = e => { const b = e.target.closest('[data-as]'); if (b) { accScope = b.dataset.as; renderAccounts(); } };
  $('#accRangeSeg').onclick = e => { const b = e.target.closest('[data-range]'); if (b) { range = +b.dataset.range; renderAccounts(); } };
  if ($('#goMissing')) $('#goMissing').onclick = () => { accTab = 'orders'; accMissing = true; renderAccounts(); };
  if ($('#missSeg')) $('#missSeg').onclick = e => { const b = e.target.closest('[data-miss]'); if (b) { accMissing = b.dataset.miss === '1'; renderAccounts(); } };
  if ($('#expCat')) {
    // category: type anything, or pick from the usual list plus the ones used before
    const box = $('#expCat'), inp = box.querySelector('input'), pop = box.querySelector('.cat-pop');
    const all = [...new Set([...EXP_CATS, ...expenses.map(x => x.category).filter(Boolean)])];
    const fill = () => { const q = inp.value.trim(), list = all.filter(c => !q || c.includes(q));
      pop.innerHTML = list.map(c => `<button type="button" data-cat="${esc(c)}" class="${c === q ? 'on' : ''}">${esc(c)}</button>`).join('') + (q && !all.includes(q) ? `<button type="button" data-cat="${esc(q)}" class="new">+ بند جديد: <b>${esc(q)}</b></button>` : ''); };
    const open = v => { if (v) fill(); box.classList.toggle('open', v); };
    inp.onfocus = () => open(true); inp.oninput = () => open(true);
    box.querySelector('.cat-tg').onclick = () => { open(!box.classList.contains('open')); inp.focus(); };
    pop.onmousedown = e => e.preventDefault();
    pop.onclick = e => { const b = e.target.closest('[data-cat]'); if (b) { inp.value = b.dataset.cat; open(false); $('#expForm [name=amount]').focus(); } };
    inp.onblur = () => setTimeout(() => open(false), 120);
    inp.onkeydown = e => { if (e.key === 'Escape') open(false); };
  }
  if ($('#expForm')) $('#expForm').onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const amount = +String(f.amount).replace(/[^\d.]/g, '');
    if (!String(f.category).trim()) return toast('اكتب البند', 'err');
    if (!amount) return toast('اكتب المبلغ', 'err');
    const { data, error } = await sb.from('shop_expenses').insert({ spent_on: f.spent_on, category: String(f.category).trim(), amount, paid_by: String(f.paid_by || '').trim().slice(0, 40) || null, note: f.note.trim() || null }).select().single(); if (error) return toast(error.message, 'err');
    expenses.unshift(data); sheetSend({ action: 'upsert', sheet: 'expenses', row: expRow(data) }); toast('اتضاف المصروف ✓', 'ok'); renderAccounts(); };
  $('#main').querySelectorAll('[data-xdel]').forEach(b => b.onclick = () => once('xdel' + b.dataset.xdel, async () => { const id = +b.dataset.xdel; if (!(await confirmBox('تحذف المصروف ده؟', 'حذف'))) return;
    const { error } = await sb.from('shop_expenses').delete().eq('id', id); if (error) return toast(error.message, 'err');
    expenses = expenses.filter(x => x.id !== id); sheetSend({ action: 'delete', sheet: 'expenses', id }); toast('اتحذف'); renderAccounts(); }));
}

/* ---------- auto-update: a new release reloads the panel by itself (same tab, same scroll) ---------- */
let dirty = false;
document.addEventListener('input', e => { if (e.target.closest('#main, .fin-m')) dirty = true; }, true);
const _go = go; go = (t, k) => { dirty = false; _go(t, k); };
const adminBusy = () => dirty || $('#editor').classList.contains('on') || !!document.querySelector('.fin-m, .confirm, .crop') || /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
async function checkBuild() {
  if (!RC.build || $('#appView').classList.contains('hidden')) return;
  try {
    const v = (await fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json())).v;
    if (!v || v === RC.build) return;
    const reload = () => { if (adminBusy()) return setTimeout(reload, 4000); try { sessionStorage.setItem('dq-admin-y', scrollY); } catch (e) {} location.reload(); };
    reload();
  } catch (e) {}
}
setInterval(() => { if (!document.hidden) checkBuild(); }, 30000);
// back in the app (phone unlocked, home-screen app reopened, notification tapped): the live connection may have slept,
// so the orders are reloaded and the connection restarted — new orders show without closing the app
let lastSync = Date.now();
async function resync(force) {
  if ($('#appView').classList.contains('hidden') || (!force && Date.now() - lastSync < 4000)) return;
  lastSync = Date.now();
  const before = new Set(orders.map(o => o.id));
  await Promise.all([loadOrders(), loadProducts(), loadFin(), loadSettings()]);
  const fresh = before.size ? orders.filter(o => !before.has(o.id)) : [];
  if (fresh.length) { fresh.forEach(o => { freshIds.add(o.id); sheetOrder(o); }); beep(); toast(fresh.length === 1 ? `طلب جديد ${fresh[0].code}` : `${fresh.length} طلبات جديدة`, 'ok'); }
  listen(); renderTabs();
  if (!adminBusy() && !$('#editor').classList.contains('on')) go(tab, true);
}
const wake = () => { checkBuild(); resync(); };
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(); });
addEventListener('focus', wake); addEventListener('online', wake);
addEventListener('pageshow', e => { if (e.persisted) wake(); });
// a push that lands while the app is open refreshes it straight away (sw.js passes it on)
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', e => { if (e.data && e.data.type === 'dq-push') resync(true); });

boot();
</script>
<style>
.pw-wrap{position:relative;display:block}
.pw-wrap input{width:100%;padding-inline-end:46px !important;box-sizing:border-box}
.pw-eye{position:absolute;top:50%;inset-inline-end:6px;transform:translateY(-50%);width:36px;height:36px;display:grid;place-items:center;border:0;background:transparent;color:inherit;opacity:.6;cursor:pointer;border-radius:8px}
.pw-eye:hover,.pw-eye:focus-visible{opacity:1}
.pw-eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pw-eye .off{display:none}.pw-eye.on .on{display:none}.pw-eye.on .off{display:block}
</style>
<script>
// show / hide password on every password field (including ones added later)
(function(){
  var ICON='<svg class="on" viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><svg class="off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.1A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17.4 17.4 0 0 0 2 12s3.5 7 10 7a9.8 9.8 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  function add(inp){
    if(inp.dataset.eye) return; inp.dataset.eye='1';
    var w=document.createElement('span'); w.className='pw-wrap';
    w.dir=getComputedStyle(inp).direction; // eye sits on the same side as the input's own text end
    inp.parentNode.insertBefore(w,inp); w.appendChild(inp);
    var b=document.createElement('button'); b.type='button'; b.className='pw-eye'; b.innerHTML=ICON;
    b.setAttribute('aria-label','Show password'); b.title='Show password';
    b.addEventListener('click',function(){
      var show=inp.type==='password'; inp.type=show?'text':'password';
      b.classList.toggle('on',show); b.setAttribute('aria-label',show?'Hide password':'Show password'); b.title=b.getAttribute('aria-label');
      inp.focus({preventScroll:true});
    });
    w.appendChild(b);
  }
  function scan(){ document.querySelectorAll('input[type=password]:not([data-eye])').forEach(add); }
  scan(); new MutationObserver(scan).observe(document.body,{childList:true,subtree:true});
})();
</script>
</body>
